<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>God Sandbox 2D — расширенная песочница</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#05070c;color:#dfe7f5;overflow:hidden;
    font:13px/1.35 "Segoe UI",Roboto,Arial,sans-serif;user-select:none}
  #app{display:flex;height:100vh;width:100vw}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 15%,#111c30 0%,#05070c 70%);
    overflow:hidden;position:relative}
  #stage canvas{max-width:100%;max-height:100%;display:block;border-radius:8px;
    box-shadow:0 0 80px rgba(60,140,255,.18),0 0 0 1px #1b2740;cursor:crosshair}
  #panel{width:360px;min-width:360px;height:100vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#0c1220,#080d17);border-left:1px solid #1b2740}
  #panel header{padding:12px 14px 10px;border-bottom:1px solid #1b2740}
  #panel h1{font-size:15px;letter-spacing:2px;font-weight:700;
    background:linear-gradient(90deg,#5ad1ff,#a77bff,#ff7ab6);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .btns{display:flex;gap:8px;margin-top:10px}
  .btns button{flex:1;padding:8px 6px;border-radius:8px;cursor:pointer;
    border:1px solid #26385a;background:#121b2e;color:#cfe0ff;
    font-size:12px;font-weight:600;transition:.15s}
  .btns button:hover{background:#1b2947;border-color:#3a558a;color:#fff}
  .btns button.active{background:#7a2020;border-color:#ff6b6b;color:#ffdada}
  .hint{margin-top:9px;font-size:11px;color:#63799e}
  #items{flex:1;overflow-y:auto;padding:10px 10px 40px}
  #items::-webkit-scrollbar{width:8px}
  #items::-webkit-scrollbar-track{background:#0a1120}
  #items::-webkit-scrollbar-thumb{background:#233355;border-radius:4px}
  #items::-webkit-scrollbar-thumb:hover{background:#33507f}
  section{margin-bottom:14px}
  section h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;
    color:#6f88b3;margin:0 0 7px 3px;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .item{display:flex;align-items:center;gap:6px;padding:7px 7px;border-radius:8px;
    cursor:pointer;border:1px solid #1e2c47;background:#101a2c;color:#c3d3ee;
    font-size:11.5px;text-align:left;transition:.12s;overflow:hidden}
  .item:hover{background:#17253e;border-color:#34507d;color:#fff;transform:translateY(-1px)}
  .item.active{background:linear-gradient(180deg,#1d3d6b,#152b4d);
    border-color:#4aa9ff;color:#fff;box-shadow:0 0 12px rgba(74,169,255,.45) inset}
  .item .ic{font-size:15px;line-height:1;flex:0 0 auto}
  .item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status{padding:8px 14px;border-top:1px solid #1b2740;
    font-size:11px;color:#5e769c;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <aside id="panel">
    <header>
      <h1>GOD SANDBOX 2D</h1>
      <div class="btns">
        <button id="btnPause">⏸ Пауза</button>
        <button id="btnClear">🗑 Очистить</button>
      </div>
      <div class="hint">ЛКМ — создать · ПКМ — действие · F — удерживать · Q/E — вращать</div>
    </header>
    <div id="items"></div>
    <div id="status"><span id="stTool">Инструмент: —</span><span id="stCount">0 тел</span></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
'use strict';
(function(){
const { Engine, Runner, Render, Composite, Bodies, Body, Events,
        Vector, Constraint, Query } = Matter;

const W = 1600, H = 900;
const engine = Engine.create({ enableSleeping:false });
engine.gravity.y = 1;
const world = engine.world;

const render = Render.create({
  element: document.getElementById('stage'),
  engine,
  options:{ width:W, height:H, pixelRatio:1, wireframes:false,
    background:'#070a11', showAngleIndicator:false, showDebug:false }
});
const canvas = render.canvas;
Render.run(render);
const runner = Runner.create();
Runner.run(runner, engine);

let walls = [];
function buildWalls(){
  const o = { isStatic:true, friction:0.7, restitution:0, render:{fillStyle:'#111a2c'} };
  walls = [
    Bodies.rectangle(W/2, H+30, W*2, 60, o),
    Bodies.rectangle(-30, H/2, 60, H*3, o),
    Bodies.rectangle(W+30, H/2, 60, H*3, o),
    Bodies.rectangle(W/2, -30, W*2, 60, o)
  ];
  walls.forEach(w => { w.isWall = true; });
  Composite.add(world, walls);
}
buildWalls();

/* ===== GLOBALS ===== */
let bodies = [], liquids = [], smoke = [], sparks = [], beams = [];
let deadCats = [];
let flash = 0;
let immortalityActive = false;
let selected = null, paused = false, bodyCounter = 0;

/* ===== HELPERS ===== */
function force(b, fx, fy){ Body.applyForce(b, b.position, { x:b.mass*fx*0.001, y:b.mass*fy*0.001 }); }
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const rnd  = (a,b) => a + Math.random()*(b-a);

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function add(b, g){
  b.g = g || {};
  if (!b.g.type) b.g.type = 'generic';
  if (b.temperature === undefined) b.temperature = 20;
  if (b.isBurning   === undefined) b.isBurning   = false;
  if (b.isCharged   === undefined) b.isCharged   = false;
  if (b.chargeTimer === undefined) b.chargeTimer = 0;
  if (b.circleRadius) {
    b.g.w = b.circleRadius * 2;
    b.g.h = b.circleRadius * 2;
  } else {
    b.g.w = b.bounds.max.x - b.bounds.min.x;
    b.g.h = b.bounds.max.y - b.bounds.min.y;
  }
  b.render.visible = false;
  Composite.add(world, b);
  bodyCounter++;
  return b;
}
function destroyBody(b){
  if (!b || (b.g && b.g.dead)) return;
  if (b.g) b.g.dead = true;
  Composite.remove(world, b);
}
function damage(b, amount){
  if (!b || !b.g || b.g.dead) return;
  if (b.g.hp === undefined) return;
  b.g.hp -= amount;
  if (immortalityActive) b.g.hp = Math.max(1, b.g.hp);
  if (b.g.hp <= 0){
    if (b.g.isCreature && b.g.type === 'cat') deadCats.push({x:b.position.x, y:b.position.y, t:6000});
    destroyBody(b);
  }
}
function nearestOfType(from, types, maxD, filter){
  let best = null, bd = maxD;
  for (const o of bodies){
    if (o === from || !o.g || o.g.dead) continue;
    if (types.indexOf(o.g.type) === -1) continue;
    if (filter && !filter(o)) continue;
    const d = dist(from.position, o.position);
    if (d < bd){ bd = d; best = o; }
  }
  return best;
}
function smokePuff(x,y,n,color,spread){
  spread = spread || 30;
  for (let i=0;i<n;i++){
    smoke.push({ x:x+rnd(-spread,spread), y:y+rnd(-spread,spread),
      vx:rnd(-1.2,1.2), vy:rnd(-1.8,-0.3), r:rnd(5,16),
      life:rnd(600,1400), maxLife:1400, color: color || 'rgba(120,130,150,1)' });
  }
}
function sparkBurst(x,y,n){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, r = rnd(6,26);
    sparks.push({ x1:x, y1:y, x2:x+Math.cos(a)*r, y2:y+Math.sin(a)*r,
      life:rnd(80,220), maxLife:220, color: Math.random()<0.5 ? '#7fd6ff' : '#ffe66b' });
  }
}
function explode(pos, radius, power){
  power = power || 1;
  for (const b of Composite.allBodies(world)){
    if (b.isStatic || b.isWall || !b.g) continue;
    const d = dist(b.position, pos);
    if (d < radius){
      const f = 1 - d/radius;
      let dir = Vector.sub(b.position, pos);
      if (Vector.magnitude(dir) < 0.001) dir = { x:0, y:-1 };
      dir = Vector.normalise(dir);
      Body.applyForce(b, b.position, { x:dir.x*f*power*0.14*b.mass, y:dir.y*f*power*0.14*b.mass });
      if (b.g.hp !== undefined) damage(b, 140*f*power);
    }
  }
  smokePuff(pos.x, pos.y, 22, 'rgba(90,90,90,1)', radius*0.22);
  smokePuff(pos.x, pos.y, 10, 'rgba(255,150,50,1)', radius*0.15);
  sparkBurst(pos.x, pos.y, 14);
}
function box(x,y,w,h,color,opts){
  return Bodies.rectangle(x,y,w,h, Object.assign({
    density:0.002, friction:0.4, restitution:0.1,
    render:{ fillStyle: color }
  }, opts || {}));
}
function circ(x,y,r,color,opts){
  return Bodies.circle(x,y,r, Object.assign({
    density:0.002, friction:0.3, restitution:0.3,
    render:{ fillStyle: color }
  }, opts || {}));
}
function dropBody(x,y,r,color,opts){
  return Bodies.circle(x,y,r, Object.assign({
    density:0.001, friction:0.005, frictionAir:0.006, restitution:0.15,
    render:{ fillStyle: color }
  }, opts || {}));
}
function toolCanHit(t){
  if (t.g.hitCool > 0) return false;
  t.g.hitCool = 250;
  return true;
}

function fireUp(b, k){
  force(b, 0, -1.6);
  b.g.life -= 16.6 * k;
  if (b.g.life <= 0){ destroyBody(b); return; }
  if (Math.random() < 0.06) smokePuff(b.position.x, b.position.y, 1, 'rgba(80,80,80,1)', 6);
  b.temperature = 900;
}
function ignite(b){
  if (!b || !b.g || b.g.dead) return;
  if (b.g.flammable && !b.isBurning){ b.isBurning = true; b.fuel = b.fuel || 100; }
  if (b.g.type === 'dynamite' || b.g.type === 'powder' || b.g.type === 'barrel' || b.g.type === 'tarBarrel'){
    b.g.fuse = Math.min(b.g.fuse === undefined ? 200 : b.g.fuse, 200);
  }
}

/* ===== REGISTRY ===== */
const ELEMENTS = {};
const ORDER = [];
function def(id, cfg){
  ELEMENTS[id] = Object.assign({ id, name:id, icon:'▫', cat:'base' }, cfg);
  ORDER.push(id);
}
const CATS = [
  { id:'base',     name:'Базовые блоки' },
  { id:'elements', name:'Стихии и жидкости' },
  { id:'weapons',  name:'Оружие и разрушение' },
  { id:'mech',     name:'Механизмы и электричество' },
  { id:'bio',      name:'Биология и коты' },
  { id:'mystic',   name:'Аномалии и артефакты' },
  { id:'nature',   name:'Природа и погода' },
  { id:'tools',    name:'Инструменты и быт' }
];

/* =========================================================
   КАТЕГОРИЯ 1 — БАЗОВЫЕ БЛОКИ
   ========================================================= */
def('stone', { name:'Камень', icon:'🪨', cat:'base', spawn:(x,y)=>{
  return add(box(x,y,48,48,'#8d949e',{density:0.008, friction:0.5, restitution:0.02}),
    { type:'stone', material:'stone', hp:400, maxHp:400 });
}});
def('crate', { name:'Ящик', icon:'📦', cat:'base', spawn:(x,y)=>{
  const b = box(x,y,46,46,'#b07d3a',{density:0.0015, friction:0.45, restitution:0.05});
  b.fuel = 100;
  return add(b, { type:'crate', material:'wood', hp:80, maxHp:80, flammable:true,
    up:(b,k)=>{
      if (b.position.y < H*0.35) return;
      for (const w of liquids){
        if (w.g.type === 'water' && dist(w.position, b.position) < 70){ force(b,0,-2.4); return; }
      }
    }});
}});
def('metal', { name:'Металл', icon:'🔩', cat:'base', spawn:(x,y)=>{
  return add(box(x,y,56,22,'#9aa7b8',{density:0.012, friction:0.4, restitution:0.05}),
    { type:'metal', material:'metal', hp:260, maxHp:260, conductsElectricity:true });
}});
def('glass', { name:'Стекло', icon:'🧊', cat:'base', spawn:(x,y)=>{
  return add(box(x,y,44,44,'rgba(140,220,255,0.72)',{density:0.003, friction:0.15, restitution:0.12}),
    { type:'glass', material:'glass', hp:26, maxHp:26, brittle:true });
}});
def('ice', { name:'Лёд', icon:'❄️', cat:'base', spawn:(x,y)=>{
  return add(box(x,y,44,44,'#bfefff',{density:0.002, friction:0.01, restitution:0.05}),
    { type:'ice', material:'ice', hp:70, maxHp:70 });
}});
def('sponge', { name:'Губка', icon:'🧽', cat:'base', spawn:(x,y)=>{
  return add(box(x,y,44,44,'#f3d24a',{density:0.0009, friction:0.7, restitution:0.05}),
    { type:'sponge', hp:70, maxHp:70, absorbed:0,
      up:(b,k)=>{
        for (const w of liquids){
          if (w.g.dead) continue;
          if (w.g.type === 'water' && dist(w.position, b.position) < 55){
            destroyBody(w); b.g.absorbed++; Body.scale(b, 1.08, 1.08);
            b.g.w *= 1.08; b.g.h *= 1.08;
          }
        }
        if (b.isBurning){ b.isBurning = false;
          for (let i=0;i<4;i++) smokePuff(b.position.x, b.position.y, 1, 'rgba(180,180,180,1)', 12);
          if (b.g.absorbed > 0){ b.g.absorbed--; Body.scale(b, 0.94, 0.94); b.g.w *= 0.94; b.g.h *= 0.94; }
        }
      }});
}});
def('ball', { name:'Мяч', icon:'🔴', cat:'base', spawn:(x,y)=>{
  return add(circ(x,y,20,'#e5555a',{density:0.0018, friction:0.04, restitution:0.9, frictionAir:0.008}),
    { type:'ball' });
}});
def('barrel', { name:'Порох', icon:'🛢️', cat:'base', spawn:(x,y)=>{
  return add(box(x,y,38,50,'#6b4b2a',{density:0.002, friction:0.5}),
    { type:'barrel', hp:40, maxHp:40, flammable:true, fuse:-1,
      up:(b,k)=>{ if (b.g.fuse > 0){ b.g.fuse -= 16.6*k;
        if (b.g.fuse <= 0){ explode(b.position, 160, 1.1); destroyBody(b); } } }});
}});
def('balloon', { name:'Шарик', icon:'🎈', cat:'base', spawn:(x,y)=>{
  return add(circ(x,y,22,'#ff7ab6',{density:0.0004, friction:0.02, frictionAir:0.02, restitution:0.6}),
    { type:'balloon', up:(b,k)=> force(b,0,-2.0) });
}});
def('anvil', { name:'Наковальня', icon:'⬛', cat:'base', spawn:(x,y)=>{
  return add(box(x,y,58,34,'#3d4350',{density:0.05, friction:0.6, restitution:0.02}),
    { type:'anvil', material:'metal', hp:800, maxHp:800, conductsElectricity:true });
}});

/* =========================================================
   КАТЕГОРИЯ 2 — СТИХИИ
   ========================================================= */
def('fire', { name:'Огонь', icon:'🔥', cat:'elements', spawn:(x,y)=>{
  const b = circ(x,y,rnd(5,9),'#ff7a1a',{density:0.0004, frictionAir:0.05, restitution:0.1});
  b.temperature = 900;
  return add(b, { type:'fire', life:2600, up:fireUp });
}});
def('water', { name:'Вода', icon:'💧', cat:'elements', spawn:(x,y)=>{
  const out=[];
  for (let i=0;i<4;i++)
    out.push(add(dropBody(x+rnd(-16,16),y+rnd(-16,16),7,'#3fa9f5'),
      { type:'water', liquid:true }));
  return out;
}});
def('lava', { name:'Лава', icon:'🌋', cat:'elements', spawn:(x,y)=>{
  const out=[];
  for (let i=0;i<3;i++){
    const b = dropBody(x+rnd(-14,14),y+rnd(-14,14),8,'#ff5b1a',{density:0.002});
    b.temperature = 1200;
    out.push(add(b, { type:'lava', liquid:true }));
  }
  return out;
}});
def('acid', { name:'Кислота', icon:'🧪', cat:'elements', spawn:(x,y)=>{
  const out=[];
  for (let i=0;i<3;i++)
    out.push(add(dropBody(x+rnd(-14,14),y+rnd(-14,14),6.5,'#7dff5c'),
      { type:'acid', liquid:true }));
  return out;
}});
def('oil', { name:'Нефть', icon:'🛢', cat:'elements', spawn:(x,y)=>{
  const out=[];
  for (let i=0;i<3;i++){
    const b = dropBody(x+rnd(-14,14),y+rnd(-14,14),7,'#3a2a1a',
      {density:0.0008, frictionAir:0.03});
    b.fuel = 200;
    out.push(add(b, { type:'oil', liquid:true, flammable:true }));
  }
  return out;
}});

/* =========================================================
   КАТЕГОРИЯ 3 — ОРУЖИЕ
   ========================================================= */
def('dynamite', { name:'Динамит', icon:'🧨', cat:'weapons', spawn:(x,y)=>{
  return add(box(x,y,18,44,'#c0392b',{density:0.002, friction:0.4}),
    { type:'dynamite', fuse:3000, up:(b,k)=>{
      b.g.fuse -= 16.6*k;
      if (b.g.fuse <= 0){ explode(b.position, 170, 1.0); destroyBody(b); }
    }});
}});
def('grenade', { name:'Граната', icon:'💣', cat:'weapons', spawn:(x,y)=>{
  return add(circ(x,y,14,'#4b6b3a',{density:0.003, friction:0.3, restitution:0.35}),
    { type:'grenade', fuse:2000, up:(b,k)=>{
      b.g.fuse -= 16.6*k;
      if (b.g.fuse <= 0){
        explode(b.position, 140, 0.9);
        for (let i=0;i<12;i++){
          const a = (i/12)*Math.PI*2;
          const s = circ(b.position.x, b.position.y, 4, '#d9d9d9', {density:0.004, frictionAir:0.01});
          Body.setVelocity(s, { x:Math.cos(a)*16, y:Math.sin(a)*16 });
          add(s, { type:'shard', hp:10, maxHp:10,
            up:(sb,k2)=>{
              for (const o of bodies){
                if (o===sb || o.isStatic || !o.g || o.g.dead) continue;
                if (dist(o.position, sb.position) < 16 && o.g.hp !== undefined) damage(o, 30);
              }
            }});
        }
        destroyBody(b);
      }
    }});
}});
def('mine', { name:'Мина', icon:'⚫', cat:'weapons', spawn:(x,y)=>{
  return add(box(x,y,34,12,'#2f3a2f',{isStatic:true}),
    { type:'mine', armed:600, up:(b,k)=>{ if (b.g.armed > 0) b.g.armed -= 16.6*k; } });
}});
def('saw', { name:'Пила', icon:'⚙️', cat:'weapons', spawn:(x,y)=>{
  return add(circ(x,y,30,'#c9d1dd',{isStatic:true}),
    { type:'saw', up:(b,k)=>{
      b.angle += 0.28*k;
      for (const o of bodies){
        if (o===b || o.isStatic || !o.g || o.g.dead) continue;
        if (dist(o.position, b.position) < 46){
          if (o.g.hp !== undefined) damage(o, 2.2*k);
          if (Math.random() < 0.15) sparkBurst(o.position.x, o.position.y, 1);
        }
      }
    }});
}});
def('rocket', { name:'Ракета', icon:'🚀', cat:'weapons', spawn:(x,y)=>{
  const dir = (mouseDir.x === 0 && mouseDir.y === 0) ? {x:1,y:0} : Vector.normalise(mouseDir);
  const b = box(x,y,16,40,'#e74c3c',{density:0.003, frictionAir:0.01});
  Body.setAngle(b, Math.atan2(dir.y,dir.x)+Math.PI/2);
  Body.setVelocity(b, {x:dir.x*8, y:dir.y*8});
  return add(b, { type:'rocket', dir, up:(b,k)=>{
    force(b, b.g.dir.x*1.4, b.g.dir.y*1.4);
    if (Math.random()<0.4) smoke.push({x:b.position.x,y:b.position.y,vx:rnd(-.4,.4),vy:rnd(0,1),
      r:rnd(3,7),life:400,maxLife:400,color:'rgba(120,120,120,1)'});
  }});
}});
def('flamethrower', { name:'Огнемет', icon:'🚒', cat:'weapons', spawn:(x,y)=>{
  return add(box(x,y,46,46,'#5a5f6d',{isStatic:true}),
    { type:'flamethrower', tick:0, up:(b,k)=>{
      b.g.tick -= k;
      if (b.g.tick <= 0){
        b.g.tick = 3;
        const f = circ(b.position.x+30, b.position.y+rnd(-12,12), rnd(4,7), '#ff8a1a',
          {density:0.0003, frictionAir:0.04});
        f.temperature = 900;
        add(f, { type:'fire', life:900, up:fireUp });
        Body.setVelocity(f, {x:8, y:rnd(-1,1)});
      }
    }});
}});
def('blackhole', { name:'Чёрная дыра', icon:'🕳️', cat:'weapons', spawn:(x,y)=>{
  return add(circ(x,y,26,'rgba(20,10,40,0.95)',{isStatic:true, isSensor:true}),
    { type:'blackhole', up:(b,k)=>{
      for (const o of bodies){
        if (o===b || o.isStatic || !o.g || o.g.dead) continue;
        const d = dist(o.position, b.position);

function makeCat(x,y,zombie){
  const b = Bodies.rectangle(x,y,44,28,{
    density:0.0016, friction:0.4, frictionAir:0.02, restitution:0.1,
    chamfer:{ radius:9 },
    render:{ visible:false }

    hp:100, maxHp:100, isCreature:true,
    dir: Math.random()<0.5 ? -1 : 1,
    timer:60, meowTimer:120, panic:0, label:'', labelTimer:0,
    up: zombie ? zombieCatAI : catAI
  });
}

function catAI(b,k){
  const g = b.g;
  if (g.dead) return;
  if (g.hp <= 0){ destroyBody(b); return; }
  g.timer -= k; g.meowTimer -= k;
  if (g.labelTimer > 0) g.labelTimer -= k; else g.label = '';
  if (g.meowTimer <= 0){
    g.meowTimer = rnd(180, 420);
    if (Math.random() < 0.45){ g.label = 'Мяу!'; g.labelTimer = 80; }
  }
  if (g.panic > 0) g.panic -= k;
  for (const w of liquids){
    if (!w.g.dead && w.g.type === 'water' && dist(w.position, b.position) < 50){
      force(b,0,-2.6); break;
    }
  }
  const danger = nearestOfType(b, ['fire','lava'], 230);
  if (danger){ g.panic = 110; g.dir = (b.position.x < danger.position.x) ? -1 : 1; }
  const toy = nearestOfType(b, ['yarnBall','alarmClock','fishBone'], 350);
  if (toy && !g.panic && Math.random() < 0.03*k) g.dir = toy.position.x > b.position.x ? 1 : -1;
  const onGround = Math.abs(b.velocity.y) < 0.8;
  if (g.timer <= 0){
    g.timer = rnd(30, 80);
    if (Math.random() < 0.4) g.dir *= -1;
    if (onGround){
      const jumpV = (g.panic > 0) ? 5.0 : 3.0;
      const fwdV  = (g.panic > 0) ? 4.0 : 2.0;
      Body.setVelocity(b, { x:b.velocity.x + g.dir*fwdV, y:-jumpV });
    }
  }
  const maxV = (g.panic > 0) ? 6 : 3.5;
  if (onGround && Math.abs(b.velocity.x) < maxV) force(b, g.dir*0.15, 0);
  const ivy = nearestOfType(b, ['ivy','ivySeg'], 40);
  if (ivy) force(b, 0, -1.2);
  if (b.position.x < 40) g.dir = 1;
  if (b.position.x > W-40) g.dir = -1;
  if (g.frozen > 0){ g.frozen -= k; Body.setVelocity(b, {x:0,y:0}); }
  if (g.poison > 0){ g.poison -= k; damage(b, 0.09*k); }
}
function zombieCatAI(b,k){
  const g = b.g;
  if (g.dead) return;
  if (g.hp <= 0){ destroyBody(b); return; }
  const target = nearestOfType(b, ['cat'], 900);
  if (target){
    const dir = (target.position.x > b.position.x) ? 1 : -1;
    if (Math.abs(b.velocity.x) < 4.5) force(b, dir*0.75, 0);
    if (b.position.y - target.position.y > 40 && Math.abs(b.velocity.y) < 0.5)
      Body.setVelocity(b, { x:b.velocity.x, y:-6 });
  } else {
    if (Math.abs(b.velocity.x) < 1.5) force(b, 0.2, 0);
  }
  if (b.position.x < 40) force(b, 1.2, 0);
  if (b.position.x > W-40) force(b, -1.2, 0);
}

  return add(box(x,y,160,50,'#4a5568',{isStatic:true, isSensor:true}),
    { type:'stormCloud', t:1000, up:(b,k)=>{
      b.g.t -= 16.6*k;
      if (b.g.t <= 0){
        b.g.t = 1500 + Math.random()*1200;
        let target = null, bestY = Infinity;
        for (const o of bodies){
          if (o===b || o.isStatic || !o.g || o.g.dead) continue;
          if (o.position.y < b.position.y) continue;
          if (Math.abs(o.position.x - b.position.x) > 200) continue;
          const isConduct = o.g.conductsElectricity || o.g.type === 'water';
          if (isConduct && o.position.y < bestY){ bestY = o.position.y; target = o; }
        }
        if (target){
          const steps = 12;
          for (let i=0;i<steps;i++){
            const t1 = i/steps, t2 = (i+1)/steps;
            sparks.push({
              x1: b.position.x + (target.position.x - b.position.x)*t1 + rnd(-6,6),
              y1: b.position.y + (target.position.y - b.position.y)*t1,
              x2: b.position.x + (target.position.x - b.position.x)*t2 + rnd(-6,6),
              y2: b.position.y + (target.position.y - b.position.y)*t2,
              life: 400, maxLife: 400, color: '#aaddff'
            });
          }
          if (target.g.hp !== undefined) damage(target, 35);
          target.isCharged = true; target.chargeTimer = 2000;
          sparkBurst(target.position.x, target.position.y, 14);
        }
      }
    }});
}});

/* =========================================================
   ФИЗИЧЕСКИЕ СИСТЕМЫ
   ========================================================= */
function gameUpdate(k){
  beams.length = 0;
  bodies  = Composite.allBodies(world).filter(b => !b.isWall);
  liquids = bodies.filter(b => b.g && b.g.liquid);
  immortalityActive = bodies.some(b => b.g && b.g.type === 'immortality');

  if (draggedBody && (!draggedBody.g || draggedBody.g.dead)) releaseDrag();
  if (gunTarget && (!gunTarget.g || gunTarget.g.dead)) gunReset();

  for (const b of bodies){ if (b.g) b.g.inFog = false; }

  for (const b of bodies){
    if (!b.g || b.g.dead) continue;
    if (b.g.hitCool > 0) b.g.hitCool -= 16.6*k;
    if (b.g.frozen > 0 && b.g.type !== 'cat' && b.g.type !== 'zombieCat'){
      b.g.frozen -= 16.6*k;
      Body.setVelocity(b, {x:0, y:0});
    }
    if (b.g.up) b.g.up(b, k);
  }

  electricitySystem(k);
  fireSystem(k);
  particleSystem(k);
  document.getElementById('stCount').textContent = bodies.length + ' тел';
}
function electricitySystem(k){
  for (const b of bodies){
    if (!b.isCharged) continue;
    if (b.chargeTimer < 1e8){
      b.chargeTimer -= 16.6*k;
      if (b.chargeTimer <= 0){ b.isCharged = false; continue; }
    }
    if (Math.random() < 0.18) sparkBurst(b.position.x, b.position.y, 1);
  }
}
function fireSystem(k){
  for (const b of bodies){
    if (!b.isBurning || b.g.dead) continue;
    b.temperature += 12*k;
    b.fuel = (b.fuel === undefined ? 100 : b.fuel) - 0.55*k;
    if (Math.random() < 0.25){
      smoke.push({x:b.position.x+rnd(-10,10), y:b.position.y+rnd(-10,10),
        vx:rnd(-0.5,0.5), vy:rnd(-2,-0.6), r:rnd(4,11),
        life:rnd(600,1300), maxLife:1300,
        color: b.g.type === 'tar' ? 'rgba(30,30,30,1)' : 'rgba(70,70,70,1)'});
    }
    if (b.g.type === 'ice'){
      damage(b, 0.7*k);
      if (Math.random() < 0.12){
        add(dropBody(b.position.x+rnd(-10,10), b.position.y+rnd(-10,10), 6, '#3fa9f5'),
          { type:'water', liquid:true });
      }
    }
    if (b.fuel <= 0){
      b.isBurning = false;
      if (b.g.hp !== undefined && b.g.type !== 'fire') damage(b, 25);
    }
  }
}
function particleSystem(k){
  for (let i=smoke.length-1;i>=0;i--){
    const p = smoke[i];
    p.x += p.vx*k; p.y += p.vy*k;
    p.vy -= 0.012*k; p.r += 0.08*k; p.life -= 16.6*k;
    if (p.life <= 0) smoke.splice(i,1);
  }
  if (smoke.length > 900) smoke.splice(0, smoke.length-900);
  for (let i=sparks.length-1;i>=0;i--){
    sparks[i].life -= 16.6*k;
    if (sparks[i].life <= 0) sparks.splice(i,1);
  }
  if (sparks.length > 600) sparks.splice(0, sparks.length-600);
  if (flash > 0) flash -= 0.018*k;
}

/* =========================================================
   КОЛЛИЗИИ
   ========================================================= */
function getType(b){ return (b.g && b.g.type) ? b.g.type : ''; }

function handlePair(a, b){
  const ta = getType(a), tb = getType(b);
  if (!ta && !tb) return;

  if (ta === 'snow' || tb === 'snow'){
    const snow = ta === 'snow' ? a : b;
    const other = ta === 'snow' ? b : a;
    if (other.isStatic || other.mass > 5){
      other.friction = 0.01;
    }
    destroyBody(snow); return;
  }

  if (ta === 'fire' || tb === 'fire'){
    const fire = ta === 'fire' ? a : b;
    const other = ta === 'fire' ? b : a;
    const to = getType(other);
    if (to === 'water' || to === 'snow'){ destroyBody(fire); destroyBody(other); return; }
    if (other.g && other.g.flammable) ignite(other);
    if (to === 'ice') damage(other, 1.5);
    if (to === 'dynamite' || to === 'barrel' || to === 'tarBarrel') ignite(other);
  }

  if (ta === 'lava' || tb === 'lava'){
    const lava = ta === 'lava' ? a : b;
    const other = ta === 'lava' ? b : a;
    const to = getType(other);
    if (to === 'water' || to === 'snow'){
      const p = {x:lava.position.x, y:lava.position.y};
      destroyBody(lava); destroyBody(other);
      add(box(p.x, p.y, 26, 26, '#4a4a55', {density:0.006, friction:0.6}),
        { type:'basalt', material:'stone', hp:300, maxHp:300 });
      smokePuff(p.x, p.y, 6, 'rgba(160,160,160,1)', 16);
      return;
    }
    if (other.g && other.g.flammable) ignite(other);
  }

  if (ta === 'acid' || tb === 'acid'){
    const acid = ta === 'acid' ? a : b;
    const other = ta === 'acid' ? b : a;
    const to = getType(other);
    if (['cat','zombieCat','crate','metal','tumbleweed','worm','slime',
         'cardboardBox','book','envelope','shield'].indexOf(to) >= 0){
      damage(other, 1.6);
      if (Math.random() < 0.08){
        destroyBody(acid);
        smokePuff(acid.position.x, acid.position.y, 2, 'rgba(120,255,120,1)', 8);
      }
    }
  }

  if (a.isCharged && b.g && b.g.conductsElectricity){ b.isCharged = true; b.chargeTimer = 2000; }
  if (b.isCharged && a.g && a.g.conductsElectricity){ a.isCharged = true; a.chargeTimer = 2000; }

  if (ta === 'oil' && (tb === 'fire' || tb === 'lava')){ ignite(a); a.fuel = 400; }
  if (tb === 'oil' && (ta === 'fire' || ta === 'lava')){ ignite(b); b.fuel = 400; }
  if (ta === 'tar' && (tb === 'fire' || tb === 'lava')){ ignite(a); a.fuel = 400; }
  if (tb === 'tar' && (ta === 'fire' || ta === 'lava')){ ignite(b); b.fuel = 400; }

  if (ta === 'dynamite' || tb === 'dynamite'){
    const d = ta === 'dynamite' ? a : b;
    const o = ta === 'dynamite' ? b : a;
    if (getType(o) === 'fire' || getType(o) === 'lava') d.g.fuse = Math.min(d.g.fuse, 100);
  }

  if (ta === 'rocket' || tb === 'rocket'){
    const r = ta === 'rocket' ? a : b;
    const o = ta === 'rocket' ? b : a;
    if (getType(o) === 'mirror' || getType(o) === 'mirrorShield'){
      r.g.dir = { x:-r.g.dir.x, y:r.g.dir.y };
      Body.setVelocity(r, { x:-r.velocity.x*0.9, y:r.velocity.y*0.9 });
      return;
    }
    const p = {x:r.position.x, y:r.position.y};
    destroyBody(r);
    explode(p, 130, 0.9); return;
  }

  if (ta === 'meteor' || tb === 'meteor'){
    const m = ta === 'meteor' ? a : b;
    if (!m.g.dead){
      const p = {x:m.position.x, y:m.position.y};
      destroyBody(m);
      explode(p, 220, 1.4);
      flash = 0.6;
    }
    return;
  }

  if (ta === 'glass' || tb === 'glass'){
    const gl = ta === 'glass' ? a : b;
    const o = ta === 'glass' ? b : a;
    const rel = Math.hypot(a.velocity.x-b.velocity.x, a.velocity.y-b.velocity.y);
    const ot = getType(o);
    if (rel > 7 || ot === 'anvil' || ot === 'stone' || ot === 'shard' || ot === 'hammer'){
      const p = {x:gl.position.x, y:gl.position.y};
      destroyBody(gl);
      for (let i=0;i<6;i++){
        const s = circ(p.x+rnd(-14,14), p.y+rnd(-14,14), rnd(3,6), 'rgba(160,230,255,0.85)',
          {density:0.002, friction:0.3, restitution:0.3});
        Body.setVelocity(s, {x:rnd(-6,6), y:rnd(-7,1)});
        add(s, { type:'shard', hp:6, maxHp:6 });
      }
    }
  }

  if (ta === 'mine' || tb === 'mine'){
    const m = ta === 'mine' ? a : b;
    const o = ta === 'mine' ? b : a;
    if (!o.isStatic && m.g.armed <= 0){
      const p = {x:m.position.x, y:m.position.y};
      destroyBody(m);
      explode(p, 170, 1.1); return;
    }
  }

  if (ta === 'button' || tb === 'button'){
    const btn = ta === 'button' ? a : b;
    const o = ta === 'button' ? b : a;
    if (!o.isStatic && o.position.y < btn.position.y && btn.g.cool <= 0){
      btn.g.cool = 400;
      for (let i=0;i<10;i++){
        const f = circ(btn.position.x+rnd(-20,20), btn.position.y-20, rnd(4,7), '#ff8a1a',
          {density:0.0003, frictionAir:0.05});
        f.temperature = 900;
        add(f, { type:'fire', life:800, up:fireUp });
        Body.setVelocity(f, {x:rnd(-2,2), y:rnd(-9,-4)});
      }
    }
  }

  if (ta === 'spring' || tb === 'spring'){
    const sp = ta === 'spring' ? a : b;
    const o = ta === 'spring' ? b : a;
    if (!o.isStatic && o.position.y < sp.position.y)
      Body.setVelocity(o, { x:o.velocity.x, y:-16 });
  }
  if (ta === 'bounceMushroom' || tb === 'bounceMushroom'){
    const m = ta === 'bounceMushroom' ? a : b;
    const o = ta === 'bounceMushroom' ? b : a;
    if (!o.isStatic && o.position.y < m.position.y)
      Body.setVelocity(o, { x:o.velocity.x, y:-19 });
  }

  if (ta === 'tpIn' || tb === 'tpIn'){
    const tIn = ta === 'tpIn' ? a : b;
    const o = ta === 'tpIn' ? b : a;
    if (!o.isStatic && tIn.g.cool <= 0){
      const outs = bodies.filter(x => x.g && x.g.type === 'tpOut');
      if (outs.length){
        const target = outs[Math.floor(Math.random()*outs.length)];
        Body.setPosition(o, { x:target.position.x, y:target.position.y - 30 });
        tIn.g.cool = 500; target.g.cool = 500;
        sparkBurst(o.position.x, o.position.y, 6);
      }
    }
  }

  if (ta === 'lensUp' || tb === 'lensUp'){
    const o = ta === 'lensUp' ? b : a;
    if (!o.isStatic && !o.g.scaledOnce){
      o.g.scaledOnce = true;
      Body.scale(o, 2, 2);
      o.g.w *= 2; o.g.h *= 2;
      o.g.maxHp = (o.g.maxHp || 100) * 2;
      o.g.hp = (o.g.hp || 100) * 2;
    }
  }
  if (ta === 'lensDown' || tb === 'lensDown'){
    const o = ta === 'lensDown' ? b : a;
    if (!o.isStatic && !o.g.scaledOnce){
      o.g.scaledOnce = true;
      Body.scale(o, 0.5, 0.5);
      o.g.w *= 0.5; o.g.h *= 0.5;
    }
  }

  if (ta === 'duplicator' || tb === 'duplicator'){
    const o = ta === 'duplicator' ? b : a;
    if (!o.isStatic && !o.g.duplicated && o.g.hp !== undefined){
      o.g.duplicated = true;
      const w = o.g.w, h = o.g.h;
      const copy = box(o.position.x + w + 24, o.position.y, w, h, o.render.fillStyle,
        {density:o.density, friction:o.friction, restitution:o.restitution});
      Body.setVelocity(copy, o.velocity);
      add(copy, Object.assign({}, o.g, { duplicated:true }));
    }
  }

  if (ta === 'impulseEraser' || tb === 'impulseEraser'){
    const o = ta === 'impulseEraser' ? b : a;
    if (!o.isStatic){ Body.setVelocity(o, {x:0, y:0}); Body.setAngularVelocity(o, 0); }
  }

  if (ta === 'booster' || tb === 'booster'){
    const bs = ta === 'booster' ? a : b;
    const o = ta === 'booster' ? b : a;
    if (!o.isStatic){
      Body.applyForce(o, o.position, { x:bs.g.dir.x*0.06*o.mass, y:bs.g.dir.y*0.06*o.mass });
      sparkBurst(o.position.x, o.position.y, 2);
    }
  }

  if (ta === 'anchor' || tb === 'anchor'){
    const an = ta === 'anchor' ? a : b;
    const o = ta === 'anchor' ? b : a;
    if (!o.isStatic && !o.g.anchored){
      o.g.anchored = true;
      Composite.add(world, Constraint.create({
        pointA: { x:an.position.x, y:an.position.y },
        bodyB: o, stiffness: 0.9, damping: 0.2, length: dist(an.position, o.position)
      }));
    }
  }

  if (ta === 'radMushroom' || tb === 'radMushroom'){
    const o = ta === 'radMushroom' ? b : a;
    if (o.g && o.g.isCreature){ o.g.poison = 1000; }
  }

  if (ta === 'zombieCat' && tb === 'cat') convertCat(b);
  if (tb === 'zombieCat' && ta === 'cat') convertCat(a);

  if (ta === 'hive' || tb === 'hive'){
    const h = ta === 'hive' ? a : b;
    const o = ta === 'hive' ? b : a;
    const rel = Math.hypot(a.velocity.x-b.velocity.x, a.velocity.y-b.velocity.y);
    if (rel > 6 || getType(o) === 'anvil' || getType(o) === 'stone'){
      const p = {x:h.position.x, y:h.position.y};
      destroyBody(h);
      for (let i=0;i<10;i++){
        const bee = circ(p.x+rnd(-20,20), p.y+rnd(-20,20), 5, '#f1c40f',
          {density:0.0006, frictionAir:0.02});
        Body.setVelocity(bee, {x:rnd(-6,6), y:rnd(-8,-2)});
        add(bee, { type:'bee', life:9000, up:(bb,k2)=>{
          bb.g.life -= 16.6*k2;
          if (bb.g.life <= 0){ destroyBody(bb); return; }
          const target = nearestOfType(bb, ['cat'], 700);
          if (target){
            const dir = Vector.normalise(Vector.sub(target.position, bb.position));
            Body.applyForce(bb, bb.position, { x:dir.x*0.004*bb.mass, y:dir.y*0.004*bb.mass });
            if (dist(bb.position, target.position) < 24) damage(target, 0.25*k2);
          }
          force(bb, 0, -1.0);
        }});
      }
    }
  }

  /* Топор рубит дерево */
  if (ta === 'axe' || tb === 'axe'){
    const t = ta === 'axe' ? a : b;
    const o = ta === 'axe' ? b : a;
    if (Math.hypot(t.velocity.x, t.velocity.y) > 2 && toolCanHit(t)){
      const ot = getType(o);
      if (ot === 'crate' || ot === 'stick' || ot === 'tumbleweed' ||
          ot === 'cardboardBox' || ot === 'shoeBox' || ot === 'bridgeSeg'){
        damage(o, 60);
        smokePuff(o.position.x, o.position.y, 1, 'rgba(120,80,50,1)', 10);
        sparkBurst(o.position.x, o.position.y, 2);
      }
    }
  }

  /* Кирка крошит камень */
  if (ta === 'pickaxe' || tb === 'pickaxe'){
    const t = ta === 'pickaxe' ? a : b;
    const o = ta === 'pickaxe' ? b : a;
    if (Math.hypot(t.velocity.x, t.velocity.y) > 2 && toolCanHit(t)){
      const ot = getType(o);
      if (ot === 'stone' || ot === 'basalt' || ot === 'anvil' || ot === 'metal'){
        damage(o, 120);
        sparkBurst(o.position.x, o.position.y, 3);
      }
    }
  }

  if (ta === 'hammer' || tb === 'hammer'){
    const t = ta === 'hammer' ? a : b;
    const o = ta === 'hammer' ? b : a;
    if (Math.hypot(t.velocity.x, t.velocity.y) > 2 && toolCanHit(t)){
      const ot = getType(o);
      if (ot === 'glass' || ot === 'egg' || ot === 'plate' || ot === 'bottle' || ot === 'handMirror'){
        destroyBody(o);
        sparkBurst(o.position.x, o.position.y, 4);
      }
    }
  }

  if (ta === 'knife' || tb === 'knife'){
    const t = ta === 'knife' ? a : b;
    const o = ta === 'knife' ? b : a;
    if (Math.hypot(t.velocity.x, t.velocity.y) > 3 && toolCanHit(t) &&
        (getType(o) === 'crate' || getType(o) === 'stick')){
      Body.setVelocity(t, {x:0, y:0});
      Body.setAngularVelocity(t, 0);
      damage(o, 10);
    }
  }

  if (ta === 'wrench' || tb === 'wrench'){
    const t = ta === 'wrench' ? a : b;
    const o = ta === 'wrench' ? b : a;
    if (Math.hypot(t.velocity.x, t.velocity.y) > 2 && toolCanHit(t)){
      const ot = getType(o);
      if (ot === 'motor' || ot === 'propeller' || ot === 'turret' || ot === 'saw'){
        o.g.disabled = true;
        sparkBurst(o.position.x, o.position.y, 5);
      }
    }
  }

  if (ta === 'pruner' || tb === 'pruner'){
    const t = ta === 'pruner' ? a : b;
    const o = ta === 'pruner' ? b : a;
    if (Math.hypot(t.velocity.x, t.velocity.y) > 1.5 && toolCanHit(t)){
      const ot = getType(o);
      if (ot === 'ivy' || ot === 'ivySeg' || ot === 'bounceMushroom' || ot === 'radMushroom'){
        destroyBody(o);
      }
    }
  }

  if (ta === 'brush' || tb === 'brush'){
    const t = ta === 'brush' ? a : b;
    const o = ta === 'brush' ? b : a;
    if (Math.hypot(t.velocity.x, t.velocity.y) > 1 && toolCanHit(t) && o.g && o.g.hp !== undefined){
      const colors = ['#e91e63','#9c27b0','#3f51b5','#00bcd4','#4caf50','#ff9800','#f44336'];
      const c = colors[Math.floor(Math.random()*colors.length)];
      o.render.fillStyle = c;
      if (o.g.type === 'cat' || o.g.type === 'zombieCat') o.g.catColor = c;
    }
  }

  if (ta === 'oilCan' || tb === 'oilCan'){
    const t = ta === 'oilCan' ? a : b;
    const o = ta === 'oilCan' ? b : a;
    if (Math.hypot(t.velocity.x, t.velocity.y) > 2 && toolCanHit(t)){
      o.friction = 0.01;
      add(dropBody(o.position.x+rnd(-15,15), o.position.y-10, 5, '#3a2a1a',
        {density:0.0008}), { type:'oil', liquid:true, flammable:true });
    }
  }

  if (ta === 'pillow' || tb === 'pillow'){
    const o = ta === 'pillow' ? b : a;
    if (!o.isStatic && Math.abs(o.velocity.y) > 3){
      Body.setVelocity(o, { x:o.velocity.x*0.2, y:0 });
    }
  }

  if ((ta === 'helmet' && tb === 'cat') || (tb === 'helmet' && ta === 'cat')){
    const h = ta === 'helmet' ? a : b;
    const c = ta === 'helmet' ? b : a;
    if (!h.g.equipped && !c.g.hasHelmet){
      c.g.hasHelmet = true;
      c.g.hp = Math.min(c.g.maxHp, c.g.hp + 30);
      destroyBody(h);
    }
  }
  if ((ta === 'rubberBoots' && tb === 'cat') || (tb === 'rubberBoots' && ta === 'cat')){
    const b2 = ta === 'rubberBoots' ? a : b;
    const c = ta === 'rubberBoots' ? b : a;
    if (!c.g.hasBoots){ c.g.hasBoots = true; destroyBody(b2); }
  }

  if (ta === 'bottle' || tb === 'bottle'){
    const bt = ta === 'bottle' ? a : b;
    const o = ta === 'bottle' ? b : a;
    const rel = Math.hypot(a.velocity.x-b.velocity.x, a.velocity.y-b.velocity.y);
    if (rel > 4){
      const p = {x:bt.position.x, y:bt.position.y};
      const contents = bt.g.contents;
      destroyBody(bt);
      if (contents === 'acid'){
        for (let i=0;i<4;i++)
          add(dropBody(p.x+rnd(-10,10), p.y+rnd(-10,10), 6, '#7dff5c'),
            { type:'acid', liquid:true });
      }
      sparkBurst(p.x, p.y, 6);
    }
  }

  if (ta === 'cardboardBox' || tb === 'cardboardBox'){
    const c = ta === 'cardboardBox' ? a : b;
    const o = ta === 'cardboardBox' ? b : a;
    if (getType(o) === 'water'){ destroyBody(o); damage(c, 5); }
  }

  if (ta === 'tv' || tb === 'tv'){
    const t = ta === 'tv' ? a : b;
    const rel = Math.hypot(a.velocity.x-b.velocity.x, a.velocity.y-b.velocity.y);
    if (rel > 6){
      const p = {x:t.position.x, y:t.position.y};
      destroyBody(t);
      sparkBurst(p.x, p.y, 15);
    }
  }

  if (ta === 'banana' || tb === 'banana'){
    const bn = ta === 'banana' ? a : b;
    const o = ta === 'banana' ? b : a;
    if (getType(o) === 'cat'){
      o.g.dir *= -1;
      Body.setAngularVelocity(o, 0.4);
      Body.setVelocity(o, { x:o.velocity.x, y:-4 });
      destroyBody(bn);
    }
  }

  if (ta === 'apple' || tb === 'apple'){
    const ap = ta === 'apple' ? a : b;
    const o = ta === 'apple' ? b : a;
    if (getType(o) === 'cat' && o.g.hp < o.g.maxHp){
      o.g.hp = Math.min(o.g.maxHp, o.g.hp + 20);
      destroyBody(ap);
    }
  }

  if (ta === 'watermelon' || tb === 'watermelon'){
    const w = ta === 'watermelon' ? a : b;
    const o = ta === 'watermelon' ? b : a;
    const rel = Math.hypot(a.velocity.x-b.velocity.x, a.velocity.y-b.velocity.y);
    if (rel > 5 || o.mass > 8){
      const p = {x:w.position.x, y:w.position.y};
      destroyBody(w);
      for (let i=0;i<6;i++){
        const sl = circ(p.x+rnd(-14,14), p.y+rnd(-14,14), 6, '#ff3344',
          {density:0.0015, restitution:0.3});
        Body.setVelocity(sl, {x:rnd(-6,6), y:rnd(-6,1)});
        add(sl, { type:'slice', hp:5, maxHp:5,
          up:(s,kk)=>{
            const c = nearestOfType(s, ['cat'], 30);
            if (c && c.g.hp < c.g.maxHp){
              c.g.hp = Math.min(c.g.maxHp, c.g.hp + 15);
              destroyBody(s);
            }
          }});
      }
    }
  }

  if (ta === 'sodaBottle' || tb === 'sodaBottle'){
    const s = ta === 'sodaBottle' ? a : b;
    const rel = Math.hypot(a.velocity.x-b.velocity.x, a.velocity.y-b.velocity.y);
    if (rel > 4 && !s.g.pressurized){
      s.g.pressurized = true;
      Body.setVelocity(s, { x:rnd(-8,8), y:-12 });
    }
  }

  if (ta === 'trap' || tb === 'trap'){
    const tr = ta === 'trap' ? a : b;
    const o = ta === 'trap' ? b : a;
    if (o.g && o.g.isCreature && !tr.g.caught && o.position.y < tr.position.y){
      tr.g.caught = o;
      o.g.frozen = 9999;
    }
  }

  if (ta === 'battery' || tb === 'battery'){
    const b2 = ta === 'battery' ? a : b;
    const o = ta === 'battery' ? b : a;
    if (getType(o) === 'water'){ o.isCharged = true; o.chargeTimer = 3000; }
  }

  if (ta === 'egg' || tb === 'egg'){
    const e = ta === 'egg' ? a : b;
    const rel = Math.hypot(a.velocity.x-b.velocity.x, a.velocity.y-b.velocity.y);
    if (rel > 6){
      destroyBody(e);
      smokePuff(e.position.x, e.position.y, 4, 'rgba(250,250,220,1)', 12);
    }
  }
}

function convertCat(cat){
  if (!cat || !cat.g || cat.g.type !== 'cat') return;
  cat.g.type = 'zombieCat';
  cat.g.up = zombieCatAI;
  cat.g.hp = 60;
  cat.g.maxHp = 60;
}

Events.on(engine, 'collisionStart', ev => {
  for (const p of ev.pairs) handlePair(p.bodyA, p.bodyB);
});

Events.on(engine, 'beforeUpdate', ev => {
  const dt = (ev.source.timing.delta) || 16.666;
  const k = Math.min(2.5, dt / 16.666);
  gameUpdate(k);
});

Events.on(render, 'beforeRender', () => {
  for (const b of bodies){
    if (!b.g) continue;
    if (b.g.inFog) b.render.opacity = 0.1;
    else if (b.render.opacity !== 1 && b.render.opacity !== undefined) b.render.opacity = 1;
  }
});

/* Вспомогательные текстуры */
function woodTex(c, w, h, base, dark){
  const hw = w/2, hh = h/2;
  c.fillStyle = base;
  c.fillRect(-hw, -hh, w, h);
  c.strokeStyle = dark; c.lineWidth = 1;
  const planks = Math.max(2, Math.floor(h/12));
  for (let i = 1; i < planks; i++){
    const y = -hh + i*h/planks;
    c.beginPath(); c.moveTo(-hw, y); c.lineTo(hw, y); c.stroke();
  }
  c.strokeStyle = dark + '88'; c.lineWidth = 0.5;
  for (let i = 0; i < planks; i++){
    const y0 = -hh + i*h/planks + 2;
    c.beginPath();
    for (let x = -hw + 2; x < hw - 2; x += 3) c.lineTo(x, y0 + Math.sin(x*0.4) * 1);
    c.stroke();
  }
  c.strokeStyle = dark; c.lineWidth = 2;
  c.strokeRect(-hw, -hh, w, h);
}
function metalTex(c, w, h, base, light){
  const hw = w/2, hh = h/2;
  const g = c.createLinearGradient(-hw, -hh, hw, hh);
  g.addColorStop(0, base);
  g.addColorStop(0.4, light);
  g.addColorStop(0.55, base);
  g.addColorStop(1, '#5a6068');
  c.fillStyle = g;
  c.fillRect(-hw, -hh, w, h);
  c.strokeStyle = '#3a4048'; c.lineWidth = 1;
  c.strokeRect(-hw, -hh, w, h);
  c.fillStyle = '#4a5058';
  [[-hw+4, -hh+4], [hw-4, -hh+4], [-hw+4, hh-4], [hw-4, hh-4]].forEach(([x,y])=>{
    c.beginPath(); c.arc(x, y, 1.8, 0, Math.PI*2); c.fill();
  });
}
function liquidTex(c, r, base, hi, life){
  const alpha = life !== undefined ? Math.min(1, life/500) : 1;
  c.globalAlpha *= alpha;
  const g = c.createRadialGradient(-r*0.3, -r*0.35, 1, 0, 0, r);
  g.addColorStop(0, hi);
  g.addColorStop(0.6, base);
  g.addColorStop(1, base);
  c.fillStyle = g;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI*2); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.55)';
  c.beginPath(); c.arc(-r*0.35, -r*0.35, r*0.22, 0, Math.PI*2); c.fill();
}

  tar: (c,w,h)=> liquidTex(c, w/2, '#1a1a1a', '#3a3a3a'),
  snow: (c,w,h)=> {
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(0,0,w/2,0,Math.PI*2); c.fill();
    c.fillStyle = 'rgba(180,220,255,0.7)';
    c.beginPath(); c.arc(-1,-1,w/4,0,Math.PI*2); c.fill();
  },
  shard: (c,w,h)=> {
    c.fillStyle = '#d9d9d9'; c.fillRect(-w/2, -h/2, w, h);
    c.strokeStyle = '#888'; c.lineWidth = 0.6; c.strokeRect(-w/2, -h/2, w, h);
  },
  bullet: (c,w,h)=>{
    c.fillStyle = '#ffdd00'; c.beginPath(); c.arc(0,0,w/2,0,Math.PI*2); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-1,-1,w/4,0,Math.PI*2); c.fill();
  },
  spark: (c,w,h,b)=>{
    const t = performance.now()*0.01;
    const flick = 0.7 + 0.3*Math.sin(t + b.id);
    c.fillStyle = `rgba(140,220,255,${flick})`;
    c.beginPath(); c.arc(0,0,w/2*flick,0,Math.PI*2); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0,0,w/4,0,Math.PI*2); c.fill();
  },

  /* ===== ОРУЖИЕ ===== */
  dynamite: (c,w,h,b)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(-hw,0,hw,0);
    g.addColorStop(0,'#7a1a10'); g.addColorStop(0.5,'#e74c3c'); g.addColorStop(1,'#7a1a10');
    c.fillStyle = g;
    roundRect(c,-hw,-hh,w,h*0.85,3); c.fill();
    c.strokeStyle = '#5a0a00'; c.lineWidth = 1; c.stroke();
    c.fillStyle = '#fff';
    c.font = `bold ${Math.max(6, w*0.45)}px Arial`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('TNT', 0, 0);
    const fuseY = -hh + h*0.05;
    const t = b.g.fuse > 0 ? b.g.fuse : 3000;
    const sparky = (3000 - t) / 3000 * 3;
    c.strokeStyle = '#333'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(0, fuseY); c.quadraticCurveTo(3+sparky, fuseY-6, 2, fuseY-10); c.stroke();
    c.fillStyle = Math.sin(performance.now()*0.02) > 0 ? '#ff0' : '#f80';
    c.beginPath(); c.arc(2, fuseY-10, 2.5, 0, Math.PI*2); c.fill();
  },
  grenade: (c,w,h)=>{
    const r=w/2;
    const g = c.createRadialGradient(-r*0.3,-r*0.3,1, 0,0,r);
    g.addColorStop(0,'#7a9a5a'); g.addColorStop(0.6,'#4b6b3a'); g.addColorStop(1,'#1a3010');
    c.fillStyle = g;
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.strokeStyle = '#1a3010'; c.lineWidth = 1; c.stroke();
    c.strokeStyle = '#2a4010'; c.lineWidth = 0.8;
    for (let i=0;i<3;i++){
      c.beginPath(); c.moveTo(-r+2, -r*0.5 + i*r*0.5); c.lineTo(r-2, -r*0.5 + i*r*0.5); c.stroke();
      c.beginPath(); c.moveTo(-r*0.5 + i*r*0.5, -r+2); c.lineTo(-r*0.5 + i*r*0.5, r-2); c.stroke();
    }
    c.fillStyle = '#888';
    c.beginPath(); c.arc(0, -r, 3, 0, Math.PI*2); c.fill();
    c.strokeStyle = '#666'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(0, -r, 4, Math.PI*1.2, Math.PI*1.8); c.stroke();
  },
  mine: (c,w,h,b)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(0,-hh,0,hh);
    g.addColorStop(0,'#3a4a3a'); g.addColorStop(1,'#1a2a1a');
    c.fillStyle = g;
    roundRect(c,-hw,-hh,w,h,4); c.fill();
    c.strokeStyle = '#0a0a0a'; c.lineWidth = 1; c.stroke();
    const armed = b.g.armed <= 0;
    const t = performance.now()*0.005;
    const blink = armed ? (0.5 + 0.5*Math.sin(t)) : 0.9;
    c.fillStyle = `rgba(255,${armed ? 30 : 0},0,${blink})`;
    c.beginPath(); c.arc(0, -hh*0.3, 2, 0, Math.PI*2); c.fill();
    c.strokeStyle = '#555'; c.lineWidth = 0.8;
    for (let i = -hw+4; i < hw; i += 6){
      c.beginPath(); c.moveTo(i, hh*0.1); c.lineTo(i, hh*0.3); c.stroke();
    }
  },
  saw: (c,w,h)=>{
    const r = w/2;
    const t = performance.now()*0.003;
    c.save(); c.rotate(t);
    c.fillStyle = '#c9d1dd';
    c.beginPath(); c.arc(0,0,r*0.85,0,Math.PI*2); c.fill();
    c.strokeStyle = '#8a939e'; c.lineWidth = 1; c.stroke();
    c.strokeStyle = '#7a838e'; c.lineWidth = 2;
    for (let i=0;i<16;i++){
      const a = i * Math.PI/8;
      const x1 = Math.cos(a)*r*0.85, y1 = Math.sin(a)*r*0.85;
      const x2 = Math.cos(a+0.1)*r, y2 = Math.sin(a+0.1)*r;
      c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    }
    c.fillStyle = '#5a6068';
    c.beginPath(); c.arc(0,0,r*0.25,0,Math.PI*2); c.fill();
    c.strokeStyle = '#3a4048'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = '#8a939e';
    c.beginPath(); c.arc(0,0,r*0.1,0,Math.PI*2); c.fill();
    c.restore();
  },
  rocket: (c,w,h,b)=>{
    const hw=w/2, hh=h/2;
    c.save();
    const t = performance.now()*0.02;
    const flick = 1 + 0.3*Math.sin(t);
    c.fillStyle = `rgba(255,180,30,${0.6 + 0.3*Math.sin(t)})`;
    c.beginPath();
    c.moveTo(-hw*0.6, hh*0.9); c.lineTo(0, hh*0.9 + 8*flick); c.lineTo(hw*0.6, hh*0.9);
    c.closePath(); c.fill();
    const g = c.createLinearGradient(-hw,0,hw,0);
    g.addColorStop(0,'#a02020'); g.addColorStop(0.5,'#e74c3c'); g.addColorStop(1,'#a02020');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(0, -hh); c.lineTo(hw, -hh*0.3); c.lineTo(hw, hh*0.8);
    c.lineTo(-hw, hh*0.8); c.lineTo(-hw, -hh*0.3); c.closePath(); c.fill();
    c.strokeStyle = '#7a1010'; c.lineWidth = 1; c.stroke();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(0, 0, hw*0.35, 0, Math.PI*2); c.fill();
    c.fillStyle = '#4fc3f7';
    c.beginPath(); c.arc(0, 0, hw*0.28, 0, Math.PI*2); c.fill();
    c.fillStyle = '#e74c3c';
    c.beginPath(); c.moveTo(-hw, hh*0.8); c.lineTo(-hw*1.4, hh*1.1); c.lineTo(-hw, hh*0.5); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(hw, hh*0.8); c.lineTo(hw*1.4, hh*1.1); c.lineTo(hw, hh*0.5); c.closePath(); c.fill();
    c.restore();
  },
  blackhole: (c,w,h,b)=>{
    const r = w/2;
    const t = performance.now()*0.002;
    const g = c.createRadialGradient(0,0,1, 0,0,r*1.4);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.4, 'rgba(30,10,60,1)');
    g.addColorStop(0.7, 'rgba(100,50,200,0.5)');
    g.addColorStop(1, 'rgba(100,50,200,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(0,0,r*1.4,0,Math.PI*2); c.fill();
    c.strokeStyle = `rgba(180,140,255,${0.6+0.3*Math.sin(t*3)})`;
    c.lineWidth = 2;
    for (let i=0;i<3;i++){
      const a = t + i*2.1;
      c.beginPath();
      c.arc(0,0, r*(0.4 + i*0.15), a, a + Math.PI*1.5);
      c.stroke();
    }
    c.fillStyle = '#000';
    c.beginPath(); c.arc(0,0,r*0.5,0,Math.PI*2); c.fill();
  },
  nuke: (c,w,h,b)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(-hw,0,hw,0);
    g.addColorStop(0,'#8a7a00'); g.addColorStop(0.5,'#e8d400'); g.addColorStop(1,'#8a7a00');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-hw, -hh*0.8); c.lineTo(hw, -hh*0.8);
    c.lineTo(hw*0.8, hh*0.7); c.lineTo(-hw*0.8, hh*0.7);
    c.closePath(); c.fill();
    c.strokeStyle = '#4a3a00'; c.lineWidth = 1.2; c.stroke();
    // Radiation symbol
    c.fillStyle = '#1a1a1a';
    const cx = 0, cy = 0, cr = Math.min(w,h) * 0.22;
    for (let i=0;i<3;i++){
      const a0 = i * Math.PI*2/3;
      c.beginPath();
      c.arc(cx, cy, cr, a0, a0 + Math.PI/3);
      c.lineTo(cx, cy);
      c.closePath(); c.fill();
    }
    c.beginPath(); c.arc(cx, cy, cr*0.28, 0, Math.PI*2); c.fill();
    c.fillStyle = '#ff0000';
    c.font = `bold ${Math.max(6, w*0.12)}px Arial`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('☢', 0, hh*0.55);
    const t = b.g.fuse > 0 ? b.g.fuse : 6000;
    const tt = (6000 - t) / 6000;
    c.fillStyle = `rgba(255,0,0,${0.5 + 0.5*Math.sin(performance.now()*0.01 * (1 + tt*3))})`;
    c.beginPath(); c.arc(0, -hh*0.5, 2.5, 0, Math.PI*2); c.fill();
  },
  flamethrower: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    metalTex(c, w, h, '#5a5f6d', '#8a8f9d');
    c.fillStyle = '#333';
    c.fillRect(hw-6, -6, 14, 12);
    c.fillStyle = '#222';
    c.fillRect(hw+6, -4, 6, 8);
    c.fillStyle = '#a02020';
    c.fillRect(-hw+4, -hh+4, w*0.4, h*0.25);
  },
  freezeRay: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(-hw,0,hw,0);
    g.addColorStop(0,'#2a8ec9'); g.addColorStop(0.5,'#7ad4ff'); g.addColorStop(1,'#2a8ec9');
    c.fillStyle = g;
    roundRect(c,-hw,-hh,w,h,4); c.fill();
    c.strokeStyle = '#1a6898'; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = '#a0e8ff';
    c.beginPath(); c.arc(0,0, hw*0.3, 0, Math.PI*2); c.fill();
    c.strokeStyle = '#e8f8ff'; c.lineWidth = 1; c.stroke();
    for (let i=0;i<6;i++){
      const a = i * Math.PI/3;
      c.beginPath();
      c.moveTo(Math.cos(a)*hw*0.35, Math.sin(a)*hw*0.35);
      c.lineTo(Math.cos(a)*hw*0.6, Math.sin(a)*hw*0.6);
      c.stroke();
    }
  },

  /* ===== МЕХАНИЗМЫ ===== */
  battery: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(-hw,0,hw,0);
    g.addColorStop(0,'#1a7a42'); g.addColorStop(0.5,'#2ecc71'); g.addColorStop(1,'#1a7a42');
    c.fillStyle = g;
    roundRect(c,-hw,-hh,w,h*0.85,2); c.fill();
    c.strokeStyle = '#0a5a32'; c.lineWidth = 1; c.stroke();
    c.fillStyle = '#888';
    c.fillRect(-hw*0.35, -hh, w*0.35, hh*0.15);
    c.fillStyle = '#fff';
    c.font = `bold ${Math.max(8, w*0.4)}px Arial`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#fff'; c.fillText('+', 0, -hh*0.3);
    c.fillStyle = '#0a3a22'; c.fillText('−', 0, hh*0.5);
    c.fillStyle = 'rgba(255,255,255,0.25)';
    c.fillRect(-hw+2, -hh+2, 3, h*0.7);
  },
  propeller: (c,w,h,b)=>{
    const r = w/2;
    const t = performance.now()*0.002;
    c.save(); c.rotate(t * 5);
    for (let i=0;i<3;i++){
      c.save(); c.rotate(i * Math.PI*2/3);
      c.fillStyle = i===0 ? '#a0a8b0' : '#7f8fa6';
      c.beginPath();
      c.moveTo(0,0); c.lineTo(r*0.15, -r*0.9);
      c.quadraticCurveTo(0, -r*1.1, -r*0.15, -r*0.9);
      c.closePath(); c.fill();
      c.strokeStyle = '#4a5058'; c.lineWidth = 0.8; c.stroke();
      c.restore();
    }
    c.fillStyle = '#444';
    c.beginPath(); c.arc(0,0,r*0.25,0,Math.PI*2); c.fill();
    c.strokeStyle = '#222'; c.lineWidth = 1; c.stroke();
    c.restore();
  },
  spring: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    c.fillStyle = '#ffd166';
    c.fillRect(-hw, -hh, w, h);
    c.strokeStyle = '#c9a030'; c.lineWidth = 1.5;
    c.beginPath();
    for (let x = -hw+4; x < hw-2; x += 6){
      c.moveTo(x, -hh+3); c.lineTo(x+3, hh-3);
    }
    c.stroke();
    c.strokeStyle = '#8a6a10'; c.lineWidth = 1.5;
    c.strokeRect(-hw, -hh, w, h);
  },
  button: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    c.fillStyle = '#444';
    c.fillRect(-hw, -hh, w, h);
    c.fillStyle = '#e74c3c';
    c.beginPath(); c.arc(0, -hh*0.3, hw*0.6, Math.PI, 0); c.closePath(); c.fill();
    c.strokeStyle = '#a01a10'; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.4)';
    c.beginPath(); c.arc(-hw*0.2, -hh*0.5, hw*0.15, 0, Math.PI*2); c.fill();
  },
  magnet: (c,w,h)=>{
    const r=w/2;
    const g = c.createRadialGradient(0,0,1, 0,0,r);
    g.addColorStop(0,'#ff5555'); g.addColorStop(0.6,'#c0392b'); g.addColorStop(1,'#7a1a10');
    c.fillStyle = g;
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.strokeStyle = '#3a0a00'; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = '#2a2a2a';
    c.beginPath(); c.arc(0,0,r*0.6,0,Math.PI*2); c.fill();
    c.fillStyle = '#fff';
    c.font = `bold ${Math.max(7,r*0.5)}px Arial`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('N', 0, -r*0.35);
    c.fillStyle = '#a0a0a0';
    c.fillText('S', 0, r*0.35);
  },
  tpIn: (c,w,h)=>{
    const r=w/2;
    const t = performance.now()*0.003;
    for (let i=3;i>=0;i--){
      c.fillStyle = `rgba(170,110,255,${0.15 + i*0.1})`;
      c.beginPath(); c.arc(0,0, r*(0.35+i*0.15), 0, Math.PI*2); c.fill();
    }
    c.strokeStyle = `rgba(200,150,255,${0.6+0.3*Math.sin(t*4)})`;
    c.lineWidth = 2;
    c.beginPath(); c.arc(0,0, r*0.85, t*2, t*2+Math.PI*1.7); c.stroke();
    c.fillStyle = '#4a1a8a';
    c.beginPath(); c.arc(0,0, r*0.3, 0, Math.PI*2); c.fill();
  },
  tpOut: (c,w,h)=>{
    const r=w/2;
    const t = performance.now()*0.003;
    for (let i=3;i>=0;i--){
      c.fillStyle = `rgba(110,200,255,${0.15 + i*0.1})`;
      c.beginPath(); c.arc(0,0, r*(0.35+i*0.15), 0, Math.PI*2); c.fill();
    }
    c.strokeStyle = `rgba(150,220,255,${0.6+0.3*Math.sin(t*4+1)})`;
    c.lineWidth = 2;
    c.beginPath(); c.arc(0,0, r*0.85, -t*2, -t*2+Math.PI*1.7); c.stroke();
    c.fillStyle = '#1a4a8a';
    c.beginPath(); c.arc(0,0, r*0.3, 0, Math.PI*2); c.fill();
  },
  motor: (c,w,h)=>{
    const r=w/2;
    c.fillStyle = '#8e7cc3';
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.strokeStyle = '#5a4a8a'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = '#5a4a8a';
    c.beginPath(); c.arc(0,0,r*0.5,0,Math.PI*2); c.fill();
    c.strokeStyle = '#c8b8ff'; c.lineWidth = 2;
    for (let i=0;i<6;i++){
      const a = i*Math.PI/3;
      c.beginPath(); c.moveTo(Math.cos(a)*r*0.6, Math.sin(a)*r*0.6);
      c.lineTo(Math.cos(a)*r*0.85, Math.sin(a)*r*0.85); c.stroke();
    }
    c.fillStyle = '#1a0a3a';
    c.beginPath(); c.arc(0,0,r*0.15,0,Math.PI*2); c.fill();
  },
  slowmo: (c,w,h)=>{
    const r=w/2;
    const g = c.createRadialGradient(0,0,r*0.2, 0,0,r);
    g.addColorStop(0,'rgba(90,150,255,0.35)');
    g.addColorStop(1,'rgba(90,150,255,0.05)');
    c.fillStyle = g;
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.strokeStyle = 'rgba(140,190,255,0.7)'; c.lineWidth = 2;
    c.beginPath(); c.arc(0,0,r-2,0,Math.PI*2); c.stroke();
    const t = performance.now()*0.001;
    c.strokeStyle = 'rgba(200,230,255,0.9)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0,0); c.lineTo(Math.cos(-t)*r*0.7, Math.sin(-t)*r*0.7); c.stroke();
    c.beginPath(); c.moveTo(0,0); c.lineTo(Math.cos(t*3)*r*0.5, Math.sin(t*3)*r*0.5); c.stroke();
  },
  conveyor: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(0,-hh,0,hh);
    g.addColorStop(0,'#5a6a74'); g.addColorStop(0.5,'#455a64'); g.addColorStop(1,'#2a3a44');
    c.fillStyle = g;
    c.fillRect(-hw,-hh,w,h);
    c.strokeStyle = '#1a2a34'; c.lineWidth = 1.2;
    c.strokeRect(-hw,-hh,w,h);
    c.strokeStyle = '#ffcc00'; c.lineWidth = 3;
    for (let i=0;i<5;i++){
      const x = -hw + 20 + i*25;
      c.beginPath();
      c.moveTo(x-6, -hh*0.5); c.lineTo(x, 0); c.lineTo(x-6, hh*0.5);
      c.stroke();
    }
    c.fillStyle = '#888';
    for (let i=0;i<6;i++){
      const x = -hw + 8 + i*22;
      c.beginPath(); c.arc(x, hh-2, 2, 0, Math.PI*2); c.fill();
    }
  },
  sparkGen: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(-hw,-hh,hw,hh);
    g.addColorStop(0,'#f1c40f'); g.addColorStop(0.5,'#f9e04a'); g.addColorStop(1,'#b89800');
    c.fillStyle = g;
    roundRect(c,-hw,-hh,w,h,3); c.fill();
    c.strokeStyle = '#8a6a00'; c.lineWidth = 1.2; c.stroke();
    c.strokeStyle = '#1a1a1a'; c.lineWidth = 2.5; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-hw*0.3, -hh*0.5); c.lineTo(hw*0.15, -hh*0.1);
    c.lineTo(-hw*0.1, hh*0.1); c.lineTo(hw*0.3, hh*0.5);
    c.stroke();
  },
  mud: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    c.fillStyle = '#5a4020';
    c.beginPath();
    c.moveTo(-hw, hh);
    c.quadraticCurveTo(-hw*0.5, -hh, 0, -hh*0.5);
    c.quadraticCurveTo(hw*0.5, -hh, hw, hh);
    c.closePath(); c.fill();
    c.strokeStyle = '#3a2808'; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = 'rgba(120,100,60,0.7)';
    for (let i=0;i<4;i++){
      const px = Math.sin(i*13)*hw*0.5, py = Math.cos(i*17)*hh*0.3;
      c.beginPath(); c.arc(px, py, 2, 0, Math.PI*2); c.fill();
    }
  },
  weightPlate: (c,w,h,b)=>{
    const hw=w/2, hh=h/2;
    c.fillStyle = b.g.triggered ? '#ff4444' : '#888888';
    roundRect(c,-hw,-hh,w,h,2); c.fill();
    c.strokeStyle = '#444'; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = '#fff';
    c.font = `bold ${Math.max(6,h*0.6)}px Arial`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(b.g.triggered ? 'OK' : '0', 0, 0);

  bridgeSeg: (c,w,h)=>{

  turret: (c,w,h)=>{

  trap: (c,w,h,b)=>{

  mirrorShield: (c,w,h)=>{

  /* ===== БИОЛОГИЯ ===== */
  slime: (c,w,h,b)=>{
    const r = w/2;
    const t = performance.now()*0.003 + b.id;
    const squish = 1 + 0.08*Math.sin(t*2);
    const g = c.createRadialGradient(-r*0.3,-r*0.3,1, 0,0,r);
    g.addColorStop(0,'#a0ffb8'); g.addColorStop(0.6,'#5ddc7a'); g.addColorStop(1,'#2a9a4a');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(0, 0, r*squish, r/squish, 0, 0, Math.PI*2);
    c.fill();
    c.strokeStyle = 'rgba(30,100,50,0.5)'; c.lineWidth = 1; c.stroke();
    // Eyes
    c.fillStyle = '#1a1a1a';
    c.beginPath(); c.arc(-r*0.3, -r*0.15, r*0.13, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(r*0.3, -r*0.15, r*0.13, 0, Math.PI*2); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(-r*0.28, -r*0.18, r*0.05, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(r*0.32, -r*0.18, r*0.05, 0, Math.PI*2); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.5)';
    c.beginPath(); c.ellipse(-r*0.4, -r*0.5, r*0.15, r*0.1, -0.5, 0, Math.PI*2); c.fill();
  },
  bat: (c,w,h,b)=>{
    const r = w/2;
    const t = performance.now()*0.008 + b.id;
    const flap = Math.sin(t) * 0.5;
    c.fillStyle = '#6b4b8a';
    // Wings
    c.beginPath();
    c.moveTo(0, 0);
    c.quadraticCurveTo(-r*1.8, -r*0.8 + flap*8, -r*1.5, r*0.3);
    c.quadraticCurveTo(-r*0.8, r*0.2, 0, 0);
    c.fill();
    c.beginPath();
    c.moveTo(0, 0);
    c.quadraticCurveTo(r*1.8, -r*0.8 + flap*8, r*1.5, r*0.3);
    c.quadraticCurveTo(r*0.8, r*0.2, 0, 0);
    c.fill();
    // Body
    c.fillStyle = '#4a2a6a';
    c.beginPath(); c.arc(0, 0, r*0.6, 0, Math.PI*2); c.fill();
    // Ears
    c.beginPath();
    c.moveTo(-r*0.4, -r*0.4); c.lineTo(-r*0.55, -r*1.1); c.lineTo(-r*0.15, -r*0.5); c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(r*0.4, -r*0.4); c.lineTo(r*0.55, -r*1.1); c.lineTo(r*0.15, -r*0.5); c.closePath(); c.fill();
    // Eyes
    c.fillStyle = '#ff2020';
    c.beginPath(); c.arc(-r*0.2, 0, r*0.1, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(r*0.2, 0, r*0.1, 0, Math.PI*2); c.fill();
  },
  hive: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(0,-hh,0,hh);
    g.addColorStop(0,'#f0b820'); g.addColorStop(0.5,'#d4a017'); g.addColorStop(1,'#8a6010');
    c.fillStyle = g;
    roundRect(c,-hw,-hh,w,h,8); c.fill();
    c.strokeStyle = '#5a4008'; c.lineWidth = 1.5; c.stroke();
    // Honeycomb pattern
    c.strokeStyle = 'rgba(120,80,10,0.6)'; c.lineWidth = 0.8;
    for (let y = -hh+6; y < hh-4; y += 8){
      for (let x = -hw+6; x < hw-4; x += 8){
        c.beginPath(); c.arc(x, y, 3, 0, Math.PI*2); c.stroke();
      }
    }
    // Entrance hole
    c.fillStyle = '#3a2808';
    c.beginPath(); c.arc(0, hh*0.5, hw*0.15, 0, Math.PI*2); c.fill();
  },
  worm: (c,w,h,b)=>{
    const r = w/2;
    const t = performance.now()*0.005 + b.id;
    const segments = 4;
    for (let i = segments-1; i >= 0; i--){
      const rr = r * (1 - i*0.15);
      const ox = Math.sin(t + i*0.6) * r * 0.15;
      const oy = Math.cos(t + i*0.6) * r * 0.1;
      const g = c.createRadialGradient(ox-rr*0.3, oy-rr*0.3, 1, ox, oy, rr);
      g.addColorStop(0,'#ffc8d8'); g.addColorStop(0.6,'#c97b8a'); g.addColorStop(1,'#7a3a48');
      c.fillStyle = g;
      c.beginPath(); c.arc(ox, oy, rr, 0, Math.PI*2); c.fill();
      c.strokeStyle = 'rgba(80,30,40,0.5)'; c.lineWidth = 0.8; c.stroke();
    }
    // Eyes
    c.fillStyle = '#1a1a1a';
    c.beginPath(); c.arc(r*0.25, -r*0.2, r*0.1, 0, Math.PI*2); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(r*0.28, -r*0.22, r*0.04, 0, Math.PI*2); c.fill();
  },
  radMushroom: (c,w,h)=>{
    const r = w/2;

    c.fillStyle = g;

  egg: (c,w,h,b)=>{
    const r = w/2;
    const g = c.createRadialGradient(-r*0.2,-r*0.3,1, 0,0,r);

    c.beginPath(); c.ellipse(-r*0.3, -r*0.4, r*0.15, r*0.22, -0.3, 0, Math.PI*2); c.fill();
  },

  /* ===== МИСТИКА ===== */

  },
  mutator: (c,w,h)=>{

  philosopher: (c,w,h)=>{

  },
  antigrav: (c,w,h)=>{

  lensDown: (c,w,h)=>{

  jelly: (c,w,h)=>{

    c.closePath(); c.fill();

  },
  impulseEraser: (c,w,h)=>{

    }
  },
  duplicator: (c,w,h)=>{

      c.beginPath();
      c.moveTo(-hw+4, -hh+8 + i*10 + Math.sin(t+i)*3);
      c.lineTo(hw-4, -hh+8 + i*10 + Math.sin(t+i)*3);
      c.stroke();
    }
    c.fillStyle = 'rgba(255,180,255,0.5)';
    c.beginPath(); c.arc(0, 0, hw*0.4, 0, Math.PI*2); c.fill();
  },
  fog: (c,w,h,b)=>{
    const r=w/2;
    const t = performance.now()*0.001 + b.id;
    for (let i=0;i<8;i++){
      const a = i/8 * Math.PI*2 + t;
      const rr = r*0.6;
      const x = Math.cos(a)*rr, y = Math.sin(a)*rr;
      const g = c.createRadialGradient(x, y, 1, x, y, r*0.5);
      g.addColorStop(0, 'rgba(220,225,235,0.35)');
      g.addColorStop(1, 'rgba(220,225,235,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(x, y, r*0.5, 0, Math.PI*2); c.fill();
    }
  },
  illusion: (c,w,h,b)=>{
    const hw=w/2, hh=h/2;
    const solid = !b.isSensor;
    const t = performance.now()*0.003 + b.id;
    const alpha = solid ? 0.85 : 0.3 + 0.15*Math.sin(t);
    c.fillStyle = `rgba(140,255,220,${alpha})`;
    roundRect(c,-hw,-hh,w,h,4); c.fill();
    c.strokeStyle = `rgba(200,255,240,${solid ? 0.9 : 0.6})`; c.lineWidth = 2;
    c.stroke();
    c.fillStyle = `rgba(255,255,255,${solid ? 0.5 : 0.3})`;
    c.beginPath(); c.arc(-hw*0.3, -hh*0.3, hw*0.15, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(hw*0.3, -hh*0.3, hw*0.15, 0, Math.PI*2); c.fill();
    c.beginPath();
    c.moveTo(-hw*0.3, hh*0.2); c.quadraticCurveTo(0, hh*0.4, hw*0.3, hh*0.2);
    c.strokeStyle = `rgba(255,255,255,${solid ? 0.7 : 0.4})`; c.lineWidth = 1.5; c.stroke();
  },
  booster: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(-hw,0,hw,0);
    g.addColorStop(0,'#ff9f43'); g.addColorStop(1,'#c06000');
    c.fillStyle = g;
    roundRect(c,-hw,-hh,w,h,4); c.fill();
    c.strokeStyle = '#5a2000'; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = '#fff';
    c.beginPath();
    c.moveTo(-hw*0.5, -hh*0.5); c.lineTo(hw*0.5, 0); c.lineTo(-hw*0.5, hh*0.5);
    c.lineTo(-hw*0.25, 0); c.closePath(); c.fill();
  },
  anchor: (c,w,h)=>{
    const r=w/2;
    c.strokeStyle = '#8a9096'; c.lineWidth = 2; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, -r*0.7); c.lineTo(0, r*0.6); c.stroke();
    c.beginPath(); c.arc(0, -r*0.75, r*0.15, 0, Math.PI*2); c.stroke();
    c.beginPath(); c.arc(0, r*0.3, r*0.5, 0, Math.PI); c.stroke();
    c.beginPath(); c.moveTo(-r*0.5, r*0.15); c.lineTo(-r*0.3, r*0.3); c.stroke();
    c.beginPath(); c.moveTo(r*0.5, r*0.15); c.lineTo(r*0.3, r*0.3); c.stroke();
  },

  /* ===== ПРИРОДА ===== */
  tumbleweed: (c,w,h,b)=>{
    const r=w/2;
    const t = performance.now()*0.002 + b.id;
    c.strokeStyle = '#8a6a17'; c.lineWidth = 1.2;
    for (let i=0;i<8;i++){
      const a = i/8 * Math.PI*2 + t;
      c.beginPath();
      c.moveTo(Math.cos(a)*r*0.3, Math.sin(a)*r*0.3);
      c.quadraticCurveTo(Math.cos(a+0.5)*r*0.8, Math.sin(a+0.5)*r*0.8,
                          Math.cos(a+0.3)*r, Math.sin(a+0.3)*r);
      c.stroke();
    }
    c.fillStyle = '#8a6a17';
    for (let i=0;i<6;i++){
      const a = i/6 * Math.PI*2;
      c.beginPath(); c.arc(Math.cos(a)*r*0.7, Math.sin(a)*r*0.7, 1.5, 0, Math.PI*2); c.fill();
    }
  },
  ivy: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    c.fillStyle = '#2e8b57';
    roundRect(c,-hw,-hh,w,h,3); c.fill();
    c.fillStyle = '#3ea868';
    for (let i=0;i<4;i++){
      const x = -hw*0.6 + (i%2)*hw*0.6, y = -hh*0.6 + Math.floor(i/2)*hh*0.7;
      c.beginPath();
      c.ellipse(x, y, hw*0.4, hh*0.15, i%2 ? 0.4 : -0.4, 0, Math.PI*2);
      c.fill();
    }
    c.strokeStyle = '#1a5a30'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(0, -hh); c.lineTo(0, hh); c.stroke();
  },
  ivySeg: (c,w,h)=> DRAWERS.ivy(c,w,h),
  bounceMushroom: (c,w,h)=>{
    const r=w/2;
    const t = performance.now()*0.002;
    const squish = 1 + 0.05*Math.sin(t);
    c.fillStyle = '#f0e0c0';
    c.fillRect(-r*0.2, 0, r*0.4, r*0.8);
    const g = c.createRadialGradient(-r*0.3,-r*0.4,1, 0,-r*0.3,r*1.1);
    g.addColorStop(0,'#ff9eb0'); g.addColorStop(0.6,'#ff6b81'); g.addColorStop(1,'#c04050');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(0, -r*0.2, r*1.0*squish, r*0.55/squish, 0, Math.PI, 0);
    c.closePath(); c.fill();
    c.strokeStyle = '#8a2030'; c.lineWidth = 1; c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.7)';
    c.beginPath(); c.arc(-r*0.4, -r*0.5, r*0.1, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(r*0.3, -r*0.5, r*0.08, 0, Math.PI*2); c.fill();
  },
  stormCloud: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const blobs = [
      [-hw*0.7, hh*0.1, hw*0.35, hh*0.6],
      [-hw*0.3, -hh*0.3, hw*0.4, hh*0.7],
      [hw*0.15, -hh*0.2, hw*0.4, hh*0.75],
      [hw*0.55, hh*0.1, hw*0.35, hh*0.55],
      [0, hh*0.2, hw*0.45, hh*0.6]
    ];
    blobs.forEach(([x,y,rx,ry])=>{
      const g = c.createRadialGradient(x-rx*0.3, y-ry*0.3, 1, x, y, Math.max(rx,ry));
      g.addColorStop(0,'#7a8898'); g.addColorStop(0.6,'#4a5568'); g.addColorStop(1,'#2a3548');
      c.fillStyle = g;
      c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); c.fill();
    });
    c.fillStyle = 'rgba(150,180,220,0.5)';
    c.beginPath(); c.arc(-hw*0.4, -hh*0.2, hw*0.08, 0, Math.PI*2); c.fill();
    const t = performance.now()*0.001;
    if (Math.sin(t*2 + performance.now()*0.001) > 0.7){
      c.fillStyle = '#ffe680';
      c.beginPath();
      c.moveTo(hw*0.1, hh*0.2); c.lineTo(hw*0.2, hh*0.4); c.lineTo(hw*0.12, hh*0.4);
      c.lineTo(hw*0.2, hh*0.65); c.lineTo(hw*0.05, hh*0.4); c.lineTo(hw*0.14, hh*0.4);
      c.closePath(); c.fill();
    }
  },
  snowCloud: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const blobs = [
      [-hw*0.7, hh*0.1, hw*0.35, hh*0.55],
      [-hw*0.3, -hh*0.3, hw*0.4, hh*0.65],
      [hw*0.15, -hh*0.2, hw*0.4, hh*0.7],
      [hw*0.55, hh*0.1, hw*0.35, hh*0.5],
      [0, hh*0.2, hw*0.45, hh*0.55]
    ];
    blobs.forEach(([x,y,rx,ry])=>{
      const g = c.createRadialGradient(x-rx*0.3, y-ry*0.3, 1, x, y, Math.max(rx,ry));
      g.addColorStop(0,'#ffffff'); g.addColorStop(0.6,'#d8e8f8'); g.addColorStop(1,'#a0b8d0');
      c.fillStyle = g;
      c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); c.fill();
    });
    c.fillStyle = 'rgba(200,220,240,0.5)';
    for (let i=0;i<3;i++){
      c.beginPath(); c.arc(-hw*0.5 + i*hw*0.4, hh*0.4 + Math.sin(performance.now()*0.005 + i)*4, 2, 0, Math.PI*2); c.fill();
    }
  },
  acidCloud: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const blobs = [
      [-hw*0.7, hh*0.1, hw*0.35, hh*0.55],
      [-hw*0.3, -hh*0.3, hw*0.4, hh*0.65],
      [hw*0.15, -hh*0.2, hw*0.4, hh*0.7],
      [hw*0.55, hh*0.1, hw*0.35, hh*0.5]
    ];
    blobs.forEach(([x,y,rx,ry])=>{
      const g = c.createRadialGradient(x-rx*0.3, y-ry*0.3, 1, x, y, Math.max(rx,ry));
      g.addColorStop(0,'rgba(180,255,160,0.8)');
      g.addColorStop(0.6,'rgba(125,255,92,0.5)');
      g.addColorStop(1,'rgba(60,150,40,0.3)');
      c.fillStyle = g;
      c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); c.fill();
    });
  },
  meteor: (c,w,h)=>{
    const r=w/2;
    const t = performance.now()*0.005;
    for (let i=0;i<3;i++){
      c.fillStyle = `rgba(255,${150+i*20},${50+i*20},${0.3 - i*0.08})`;
      c.beginPath();
      c.arc(r*0.6 + i*3, -r*0.6 - i*3, r*0.5, 0, Math.PI*2); c.fill();
    }
    const g = c.createRadialGradient(-r*0.3,-r*0.3,1, 0,0,r);
    g.addColorStop(0,'#b07050'); g.addColorStop(0.5,'#8b4513'); g.addColorStop(1,'#3a1a08');
    c.fillStyle = g;
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.strokeStyle = '#2a0a00'; c.lineWidth = 1; c.stroke();
    c.fillStyle = '#3a1a08';
    for (let i=0;i<5;i++){
      const a = i*1.3 + b_rotation(t);
      c.beginPath(); c.arc(Math.cos(a)*r*0.4, Math.sin(a)*r*0.4, r*0.1, 0, Math.PI*2); c.fill();
    }
  },
  grail: (c,w,h)=>{
    const r=w/2;
    const t = performance.now()*0.002;
    const glow = 0.5 + 0.5*Math.sin(t*3);
    c.shadowColor = `rgba(255,215,0,${glow})`; c.shadowBlur = 20;
    const g = c.createLinearGradient(-r,0,r,0);
    g.addColorStop(0,'#a08000'); g.addColorStop(0.5,'#ffd700'); g.addColorStop(1,'#a08000');
    c.fillStyle = g;
    // Cup
    c.beginPath();
    c.moveTo(-r*0.7, -r*0.7);
    c.lineTo(r*0.7, -r*0.7);
    c.lineTo(r*0.45, r*0.1);
    c.quadraticCurveTo(0, r*0.3, -r*0.45, r*0.1);
    c.closePath(); c.fill();
    // Stem
    c.fillRect(-r*0.1, r*0.15, r*0.2, r*0.4);
    // Base
    c.beginPath(); c.ellipse(0, r*0.75, r*0.5, r*0.15, 0, 0, Math.PI*2); c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = '#5a4000'; c.lineWidth = 1.2; c.stroke();
    // Gem
    c.fillStyle = '#ff2020';
    c.beginPath(); c.arc(0, -r*0.1, r*0.15, 0, Math.PI*2); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.6)';
    c.beginPath(); c.arc(-r*0.05, -r*0.15, r*0.05, 0, Math.PI*2); c.fill();
  },
  fertilityTotem: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(-hw,0,hw,0);
    g.addColorStop(0,'#5a3a10'); g.addColorStop(0.5,'#8b6f3a'); g.addColorStop(1,'#5a3a10');
    c.fillStyle = g;
    roundRect(c,-hw,-hh,w,h*0.8,3); c.fill();
    c.strokeStyle = '#3a2010'; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = '#2e8b57';
    c.beginPath();
    c.ellipse(0, -hh*0.95, hw*1.2, hh*0.15, 0, 0, Math.PI*2); c.fill();
    c.beginPath();
    c.ellipse(-hw*0.6, -hh*1.15, hw*0.5, hh*0.12, -0.5, 0, Math.PI*2); c.fill();
    c.beginPath();
    c.ellipse(hw*0.6, -hh*1.15, hw*0.5, hh*0.12, 0.5, 0, Math.PI*2); c.fill();
    c.fillStyle = '#1a5a30';
    c.font = `bold ${Math.max(6,h*0.1)}px Arial`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('ᛒᛖᚱ', 0, -hh*0.2);
    c.fillText('ᚲᚨᛏ', 0, hh*0.1);
  },
  weatherRadar: (c,w,h)=>{
    const r=w/2;
    c.fillStyle = '#888';
    c.fillRect(-r*0.1, 0, r*0.2, r*0.9);
    c.fillStyle = '#5a5a5a';
    c.beginPath(); c.arc(0,0,r*0.8,Math.PI*1.15,Math.PI*1.85); c.stroke();
    c.strokeStyle = '#aaa'; c.lineWidth = 3;
    c.beginPath(); c.arc(0,0,r*0.7,Math.PI*1.1,Math.PI*1.9); c.stroke();
    c.fillStyle = '#666';
    c.beginPath(); c.arc(0,0,r*0.15,0,Math.PI*2); c.fill();
    c.strokeStyle = '#4a4a4a'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0,0); c.lineTo(r*0.5, -r*0.5); c.stroke();
    const t = performance.now()*0.001;
    c.strokeStyle = `rgba(100,255,100,${0.5+0.5*Math.sin(t*3)})`;
    c.lineWidth = 1.5;
    c.beginPath(); c.arc(0,0,r*0.4,t*2,t*2+1); c.stroke();
  },
  crystal: (c,w,h,b)=>{
    const r=w/2;
    const t = performance.now()*0.002 + b.id;
    const pulse = 1 + 0.1*Math.sin(t*2);
    c.shadowColor = '#a020f0'; c.shadowBlur = 12;
    const g = c.createRadialGradient(-r*0.3,-r*0.3,1, 0,0,r*pulse);
    g.addColorStop(0,'#d090ff'); g.addColorStop(0.5,'#a020f0'); g.addColorStop(1,'#4a0a70');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(0, -r*pulse); c.lineTo(r*0.8, 0); c.lineTo(0, r*pulse); c.lineTo(-r*0.8, 0);
    c.closePath(); c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = '#e0b0ff'; c.lineWidth = 1.5; c.stroke();
    c.beginPath(); c.moveTo(0, -r*pulse); c.lineTo(0, r*pulse); c.stroke();
    c.beginPath(); c.moveTo(-r*0.8, 0); c.lineTo(r*0.8, 0); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.6)';
    c.beginPath(); c.moveTo(-r*0.3,-r*0.4); c.lineTo(-r*0.1,-r*0.2); c.lineTo(-r*0.3,0); c.closePath(); c.fill();
  },
  weightlessRune: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const t = performance.now()*0.001;
    const glow = 0.5 + 0.5*Math.sin(t*3);
    c.shadowColor = `rgba(170,136,255,${glow})`; c.shadowBlur = 12;
    const g = c.createLinearGradient(-hw,-hh,hw,hh);
    g.addColorStop(0,'#c0a0ff'); g.addColorStop(0.5,'#aa88ff'); g.addColorStop(1,'#5a3a9a');
    c.fillStyle = g;
    roundRect(c,-hw,-hh,w,h,4); c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = '#e0d0ff'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#fff';
    c.font = `bold ${Math.max(10,h*0.5)}px Arial`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('ᚱ', 0, 0);
  },
  solarConcentrator: (c,w,h,b)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(-hw,-hh,hw,hh);
    g.addColorStop(0,'#ffe680'); g.addColorStop(0.5,'#ffdd00'); g.addColorStop(1,'#c0a000');
    c.fillStyle = g;
    roundRect(c,-hw,-hh,w,h,6); c.fill();
    c.strokeStyle = '#8a7000'; c.lineWidth = 1.5; c.stroke();
    // Lens
    c.fillStyle = 'rgba(255,255,200,0.7)';
    c.beginPath(); c.arc(0, 0, hw*0.35, 0, Math.PI*2); c.fill();
    c.strokeStyle = '#a08000'; c.lineWidth = 1.5; c.stroke();
    const t = performance.now()*0.003;
    c.strokeStyle = `rgba(255,255,150,${0.6+0.4*Math.sin(t*3)})`;
    c.lineWidth = 2;
    c.beginPath();
    for (let a=0;a<Math.PI*2;a+=0.2){
      const x = Math.cos(a+t)*hw*0.85, y = Math.sin(a+t)*hh*0.85;
      if (a===0) c.moveTo(x,y); else c.lineTo(x,y);
    }
    c.stroke();
  },
  snow: (c,w,h)=> DRAWERS.snow(c,w,h),
  basalt: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    c.fillStyle = '#4a4a55';
    roundRect(c,-hw,-hh,w,h,3); c.fill();
    c.strokeStyle = '#2a2a35'; c.lineWidth = 1; c.stroke();
    c.fillStyle = '#3a3a45';
    for (let i=0;i<5;i++){
      c.beginPath();
      c.arc(Math.sin(i*13)*hw*0.5, Math.cos(i*17)*hh*0.5, 2, 0, Math.PI*2); c.fill();
    }
  },
  crystalMoss: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    c.fillStyle = 'rgba(200,100,255,0.7)';
    roundRect(c,-hw,-hh,w,h,3); c.fill();
    c.strokeStyle = 'rgba(150,50,200,0.9)'; c.lineWidth = 1; c.stroke();
    c.fillStyle = 'rgba(255,200,255,0.8)';
    for (let i=0;i<4;i++){
      c.beginPath();
      c.arc(Math.sin(i*17)*hw*0.5, Math.cos(i*23)*hh*0.5, 1.5, 0, Math.PI*2); c.fill();
    }
  },

  /* ===== БЫТ / МУСОР ===== */
  bottle: (c,w,h,b)=>{
    const hw=w/2, hh=h/2;
    const contents = b.g.contents === 'acid';
    const color = contents ? 'rgba(140,255,140,0.6)' : 'rgba(180,220,240,0.6)';
    // Body
    c.fillStyle = color;
    roundRect(c,-hw,-hh*0.6,w,h*0.85,3); c.fill();
    // Neck
    c.fillRect(-hw*0.5, -hh, w*0.5, h*0.35);
    // Cap
    c.fillStyle = '#8B4513';
    c.fillRect(-hw*0.6, -hh-2, w*0.6, h*0.1);
    // Outline
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 1;
    c.strokeRect(-hw*0.5, -hh, w*0.5, h*0.35);
    // Highlight
    c.fillStyle = 'rgba(255,255,255,0.5)';
    c.fillRect(-hw*0.7, -hh*0.4, w*0.15, h*0.5);
    // Label
    c.fillStyle = '#fff';
    c.fillRect(-hw*0.8, hh*0.1, w*0.5, h*0.15);
    c.fillStyle = contents ? '#0a5a0a' : '#5a3a10';
    c.font = `bold ${Math.max(5,h*0.08)}px Arial`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(contents ? 'ACID' : 'WATER', -hw*0.55, hh*0.2);
  },
  tire: (c,w,h)=>{
    const r=w/2;
    c.fillStyle = '#1a1a1a';
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.fillStyle = '#2a2a2a';
    c.beginPath(); c.arc(0,0,r*0.65,0,Math.PI*2); c.fill();
    c.fillStyle = '#0a0a0a';
    c.beginPath(); c.arc(0,0,r*0.4,0,Math.PI*2); c.fill();
    c.strokeStyle = '#444'; c.lineWidth = 1.5;
    for (let i=0;i<16;i++){
      const a = i*Math.PI/8;
      const x1 = Math.cos(a)*r*0.7, y1 = Math.sin(a)*r*0.7;
      const x2 = Math.cos(a)*r*0.95, y2 = Math.sin(a)*r*0.95;
      c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    }
    c.strokeStyle = 'rgba(255,255,255,0.1)'; c.lineWidth = 0.5;
    c.beginPath(); c.arc(0,0,r*0.85,0,Math.PI*2); c.stroke();
  },
  can: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(-hw,0,hw,0);

  helmet: (c,w,h)=>{

  jetpack: (c,w,h,b)=>{
    const hw=w/2, hh=h/2;

  },
  cape: (c,w,h,b)=>{
    const hw=w/2, hh=h/2;
    const t = performance.now()*0.003 + b.id;
    const wav = Math.sin(t) * 3;
    const g = c.createLinearGradient(0,-hh,0,hh);
    g.addColorStop(0,'#b71c1c'); g.addColorStop(0.5,'#8a1010'); g.addColorStop(1,'#5a0808');

    c.beginPath();
    c.moveTo(-hw*0.7, -hh);
    c.lineTo(hw*0.7, -hh);
    c.quadraticCurveTo(hw + wav, hh*0.4, hw*0.9 + wav*0.5, hh);
    c.quadraticCurveTo(0, hh*1.1, -hw*0.9 - wav*0.5, hh);
