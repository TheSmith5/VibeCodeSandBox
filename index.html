    c.closePath(); c.fill();
    c.strokeStyle = '#3a0000'; c.lineWidth = 1.2; c.stroke();
    c.strokeStyle = 'rgba(255,80,80,0.3)'; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(-hw*0.4, -hh*0.5); c.lineTo(-hw*0.4 + wav, hh*0.8); c.stroke();
    c.beginPath(); c.moveTo(hw*0.4, -hh*0.5); c.lineTo(hw*0.4 + wav, hh*0.8); c.stroke();
  },
  pot: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    metalTex(c, w, h*0.85, '#a0a0a0', '#d0d0d0');
    c.fillStyle = '#666';
    c.fillRect(-hw*0.9, -hh, w*1.8, hh*0.25);
    c.strokeStyle = '#444'; c.lineWidth = 1; c.strokeRect(-hw*0.9, -hh, w*1.8, hh*0.25);
    c.strokeStyle = '#666'; c.lineWidth = 2.5;
    c.beginPath(); c.arc(-hw*0.5, -hh*0.5, hw*0.2, Math.PI, 0); c.stroke();
    c.beginPath(); c.arc(hw*0.5, -hh*0.5, hw*0.2, Math.PI, 0); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.3)';
    c.fillRect(-hw+3, -hh*0.7, 3, h*0.6);
  },
  rollingPin: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    const g = c.createLinearGradient(0,-hh,0,hh);
    g.addColorStop(0,'#e0c090'); g.addColorStop(0.5,'#c69560'); g.addColorStop(1,'#8a6030');
    c.fillStyle = g;
    roundRect(c,-hw*0.8,-hh,w*0.9,h,h/2); c.fill();
    c.strokeStyle = '#5a3a10'; c.lineWidth = 1; c.stroke();
    c.fillStyle = '#8a6030';
    c.fillRect(-hw*0.95,-hh*0.4, w*0.2, h*0.8);
    c.fillRect(hw*0.15,-hh*0.4, w*0.2, h*0.8);
    c.strokeStyle = '#5a3a10'; c.lineWidth = 0.8;
    c.strokeRect(-hw*0.95,-hh*0.4, w*0.2, h*0.8);
    c.strokeRect(hw*0.15,-hh*0.4, w*0.2, h*0.8);
    c.strokeStyle = 'rgba(80,50,20,0.4)'; c.lineWidth = 0.6;
    for (let i=0;i<3;i++){

  },
  watermelon: (c,w,h)=>{
    const r=w/2;
    const g = c.createRadialGradient(-r*0.3,-r*0.3,1, 0,0,r);

  },
  donut: (c,w,h)=>{
    const r=w/2;
    const g = c.createRadialGradient(0,0,r*0.2, 0,0,r);
    g.addColorStop(0,'#e0a070'); g.addColorStop(0.5,'#c68c53'); g.addColorStop(1,'#8a6030');

  sodaBottle: (c,w,h,b)=>{

  shoeBox: (c,w,h)=>{
    const hw=w/2, hh=h/2;

    roundRect(c,-hw,-hh,w,h,2); c.fill();
    c.strokeStyle = '#5a3a10'; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = '#c09060';

    c.strokeStyle = '#5a3a10'; c.lineWidth = 1;

  toothbrush: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    c.fillStyle = '#1976d2';
    c.fillRect(-hw*0.6, -hh*0.5, w*0.6, hh*1.5);
    c.strokeStyle = '#0a4a8a'; c.lineWidth = 0.8;
    c.strokeRect(-hw*0.6, -hh*0.5, w*0.6, hh*1.5);
    c.fillStyle = '#fff';
    c.fillRect(-hw*0.6, -hh, w*0.6, hh*0.5);
    c.strokeStyle = '#aaa'; c.lineWidth = 0.5;
    for (let i=0;i<5;i++){
      c.beginPath();

  brokenGlasses: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    c.strokeStyle = '#333'; c.lineWidth = 2;
    c.beginPath(); c.arc(-hw*0.4, 0, hw*0.3, 0, Math.PI*2); c.stroke();
    c.beginPath(); c.arc(hw*0.4, 0, hw*0.3, 0, Math.PI*2); c.stroke();

    c.strokeStyle = '#555'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(-hw*0.7, -hh*0.5); c.lineTo(-hw*0.5, -hh*0.3); c.stroke();
    c.beginPath(); c.moveTo(hw*0.7, -hh*0.5); c.lineTo(hw*0.5, -hh*0.3); c.stroke();
    // Crack
    c.strokeStyle = '#333'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(-hw*0.4, -hh*0.3); c.lineTo(-hw*0.3, hh*0.3); c.lineTo(-hw*0.5, hh*0.1); c.stroke();

  envelope: (c,w,h)=>{
    const hw=w/2, hh=h/2;
    c.fillStyle = '#f5f0e0';
    c.fillRect(-hw,-hh,w,h);
    c.strokeStyle = '#c0b090'; c.lineWidth = 1.2; c.strokeRect(-hw,-hh,w,h);
    // Flap
    c.strokeStyle = '#a09080'; c.lineWidth = 1;
    c.beginPath();
    c.moveTo(-hw, -hh); c.lineTo(0, 0); c.lineTo(hw, -hh);
    c.stroke();
    // Seal
    c.fillStyle = '#c0392b';
    c.beginPath(); c.arc(0, 0, hw*0.15, 0, Math.PI*2); c.fill();
    c.strokeStyle = '#8a2010'; c.lineWidth = 0.6; c.stroke();

  coin: (c,w,h)=>{
    const r=w/2;
    const g = c.createRadialGradient(-r*0.3,-r*0.3,1, 0,0,r);
    g.addColorStop(0,'#fff080'); g.addColorStop(0.6,'#ffd700'); g.addColorStop(1,'#a08000');
    c.fillStyle = g;
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.strokeStyle = '#5a4000'; c.lineWidth = 1.2; c.stroke();
    c.strokeStyle = '#c0a000'; c.lineWidth = 1;
    c.beginPath(); c.arc(0,0,r*0.7,0,Math.PI*2); c.stroke();
    c.fillStyle = '#8a6000';
    c.font = `bold ${Math.max(6,r*0.7)}px serif`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('$', 0, 1);
    c.fillStyle = 'rgba(255,255,255,0.6)';
    c.beginPath(); c.ellipse(-r*0.35,-r*0.4, r*0.15, r*0.1, -0.6, 0, Math.PI*2); c.fill();
  },
  alarmClock: (c,w,h,b)=>{
    const hw=w/2, hh=h/2;
    const r = hw*0.85;
    // Bells
    c.fillStyle = '#a0a0a0';
    c.beginPath(); c.arc(-r*0.7, -hh*0.7, hw*0.25, Math.PI, 0); c.fill();
    c.beginPath(); c.arc(r*0.7, -hh*0.7, hw*0.25, Math.PI, 0); c.fill();
    c.strokeStyle = '#666'; c.lineWidth = 1; c.stroke();
    // Feet
    c.fillStyle = '#666';
    c.fillRect(-r*0.5, hh*0.8, r*0.2, hh*0.2);
    c.fillRect(r*0.3, hh*0.8, r*0.2, hh*0.2);
    // Clock body
    const g = c.createRadialGradient(-r*0.2,-r*0.2, 2, 0,0, r);
    g.addColorStop(0,'#e0e0e0'); g.addColorStop(0.6,'#b0b0b0'); g.addColorStop(1,'#707070');
    c.fillStyle = g;
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.strokeStyle = '#444'; c.lineWidth = 1.5; c.stroke();
    // Face
    c.fillStyle = '#f8f8f0';
    c.beginPath(); c.arc(0,0,r*0.82,0,Math.PI*2); c.fill();
    // Hour marks
    c.strokeStyle = '#333'; c.lineWidth = 1;
    for (let i=0;i<12;i++){
      const a = i*Math.PI/6;
      c.beginPath();
      c.moveTo(Math.cos(a)*r*0.65, Math.sin(a)*r*0.65);
      c.lineTo(Math.cos(a)*r*0.78, Math.sin(a)*r*0.78);
      c.stroke();
    }
    // Hands
    const t = performance.now()*0.001;
    c.strokeStyle = '#222'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0,0); c.lineTo(Math.cos(-t*0.3)*r*0.5, Math.sin(-t*0.3)*r*0.5); c.stroke();
    c.strokeStyle = '#c00'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(0,0); c.lineTo(Math.cos(t)*r*0.7, Math.sin(t)*r*0.7); c.stroke();
    c.fillStyle = '#222';
    c.beginPath(); c.arc(0,0,r*0.06,0,Math.PI*2); c.fill();
  }
};

/* Универсальная отрисовка */
function drawBody(c, b){
  if (!b.g || b.g.dead) return;
  if (b.collisionFilter && b.collisionFilter.mask === 0) return;
  const w = b.g.w || 20, h = b.g.h || 20;
  c.save();
  c.globalAlpha = b.g.inFog ? 0.1 : (b.render.opacity !== undefined ? b.render.opacity : 1);
  c.translate(b.position.x, b.position.y);
  c.rotate(b.angle);
  const fn = DRAWERS[b.g.type];
  if (fn) fn(c, w, h, b);
  else {
    c.fillStyle = b.render.fillStyle || '#888';
    if (b.circleRadius){
      c.beginPath(); c.arc(0,0,b.circleRadius,0,Math.PI*2); c.fill();
    } else {
      c.fillRect(-w/2,-h/2,w,h);
    }
  }
  c.restore();
}

/* ============ КОТ ============ */
function drawCat(ctx, b){
  const w = b.g.w, h = b.g.h;
  const hw = w/2, hh = h/2;
  const isZombie = b.g.type === 'zombieCat';
  let bodyColor = isZombie ? '#6fbf5a' : '#e8a13c';
  let darkColor = isZombie ? '#3d7a2a' : '#a8712a';
  if (b.g.poison > 0){ bodyColor = '#7dff5c'; darkColor = '#4ea830'; }
  if (b.g.frozen > 0){ bodyColor = '#8fe3ff'; darkColor = '#5ca8c8'; }
  if (b.g.catColor) bodyColor = b.g.catColor;
  const innerEar = isZombie ? '#a55555' : '#ff9eb3';
  const eyeColor = isZombie ? '#ff2020' : '#2a2a2a';
  const facing = b.velocity.x < -0.3 ? -1 : 1;

  ctx.save();
  ctx.globalAlpha = b.g.inFog ? 0.1 : 1;
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);
  ctx.scale(facing, 1);

  const t = (performance.now()*0.004) + b.id;
  const wag = Math.sin(t) * 0.4;
  ctx.strokeStyle = bodyColor;
  ctx.lineWidth = Math.max(3, h*0.14);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-hw*0.75, 0);
  ctx.quadraticCurveTo(-hw*1.1, -hh*0.5 + wag*8, -hw*1.35, -hh*0.8 + wag*14);
  ctx.stroke();

  roundRect(ctx, -hw, -hh, w, h, Math.min(hw, hh)*0.55);
  ctx.fillStyle = bodyColor; ctx.fill();
  ctx.strokeStyle = darkColor; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(hw*0.30, -hh); ctx.lineTo(hw*0.55, -hh*1.55); ctx.lineTo(hw*0.78, -hh);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hw*0.02, -hh); ctx.lineTo(hw*0.27, -hh*1.42); ctx.lineTo(hw*0.50, -hh);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.fillStyle = innerEar;
  ctx.beginPath();
  ctx.moveTo(hw*0.36, -hh); ctx.lineTo(hw*0.55, -hh*1.38); ctx.lineTo(hw*0.72, -hh);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hw*0.10, -hh); ctx.lineTo(hw*0.27, -hh*1.30); ctx.lineTo(hw*0.44, -hh);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = eyeColor;
  ctx.beginPath(); ctx.arc(hw*0.22, -hh*0.15, h*0.13, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hw*0.58, -hh*0.15, h*0.13, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(hw*0.25, -hh*0.20, h*0.045, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hw*0.61, -hh*0.20, h*0.045, 0, Math.PI*2); ctx.fill();
  if (isZombie){
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(hw*0.22, -hh*0.15, h*0.06, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hw*0.58, -hh*0.15, h*0.06, 0, Math.PI*2); ctx.fill();
  }

  ctx.fillStyle = isZombie ? '#661111' : '#ff6b9d';
  ctx.beginPath();
  ctx.moveTo(hw*0.32, hh*0.18); ctx.lineTo(hw*0.50, hh*0.18); ctx.lineTo(hw*0.41, hh*0.32);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = darkColor; ctx.lineWidth = 1;
  for (let i=0;i<3;i++){
    ctx.beginPath(); ctx.moveTo(hw*0.48, hh*0.20 + i*2.5); ctx.lineTo(hw*1.15, hh*0.10 + i*4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hw*0.48, hh*0.20 - i*2.5); ctx.lineTo(hw*1.15, hh*0.10 - i*4); ctx.stroke();
  }

  ctx.fillStyle = darkColor;
  const pawR = Math.max(3, h*0.16);
  const ox = [-hw*0.65, -hw*0.20, hw*0.20, hw*0.65];
  for (let k=0;k<4;k++){
    ctx.beginPath(); ctx.arc(ox[k], hh - pawR*0.3, pawR, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#f5f0e0';
  ctx.beginPath(); ctx.arc(hw*0.62, hh - pawR*0.3 + pawR*0.4, pawR*0.35, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hw*0.22, hh - pawR*0.3 + pawR*0.4, pawR*0.35, 0, Math.PI*2); ctx.fill();

  if (b.g.hasHelmet){
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath(); ctx.arc(0, -hh*0.9, hw*0.7, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#a08000'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  ctx.restore();
}

/* ============ ИНСТРУМЕНТЫ ============ */
function drawTool(ctx, b){
  const w = b.g.w, h = b.g.h;
  const hw = w/2, hh = h/2;
  ctx.save();
  ctx.globalAlpha = b.g.inFog ? 0.1 : 1;
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);

  const type = b.g.type;
  switch(type){
    case 'axe': {
      ctx.fillStyle = '#7a4a1a';
      ctx.fillRect(-2.5, -hh*0.3, 5, hh*1.3);
      ctx.strokeStyle = '#5a3a0a'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(-1, -hh*0.3); ctx.lineTo(-1, hh*0.9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(1, -hh*0.3); ctx.lineTo(1, hh*0.9); ctx.stroke();
      const grad = ctx.createLinearGradient(-hw, -hh, hw, 0);
      grad.addColorStop(0, '#e0e0e0'); grad.addColorStop(0.5, '#a0a0a0'); grad.addColorStop(1, '#707070');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-hw*0.8, -hh*0.4); ctx.lineTo(-hw*1.0, -hh*0.9);
      ctx.quadraticCurveTo(0, -hh*1.15, hw*1.0, -hh*0.9);
      ctx.lineTo(hw*0.8, -hh*0.4);
      ctx.quadraticCurveTo(0, -hh*0.6, -hw*0.8, -hh*0.4);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#404040'; ctx.lineWidth = 1; ctx.stroke();
      break;
    }
    case 'pickaxe': {
      ctx.fillStyle = '#7a4a1a';
      ctx.fillRect(-2.5, -hh*0.3, 5, hh*1.3);
      ctx.strokeStyle = '#888'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-hw*1.3, -hh*0.9); ctx.quadraticCurveTo(0, -hh*0.5, hw*1.3, -hh*0.9);
      ctx.stroke();
      ctx.strokeStyle = '#bbb'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-hw*1.3, -hh*0.9); ctx.quadraticCurveTo(0, -hh*0.55, hw*1.3, -hh*0.9);
      ctx.stroke();
      break;
    }
    case 'hammer': {
      ctx.fillStyle = '#7a4a1a';
      ctx.fillRect(-2.5, -hh*0.3, 5, hh*1.3);
      const grad = ctx.createLinearGradient(-hw, -hh, hw, 0);
      grad.addColorStop(0, '#888'); grad.addColorStop(0.5, '#ccc'); grad.addColorStop(1, '#666');
      ctx.fillStyle = grad;
      ctx.fillRect(-hw, -hh*0.85, w, hh*0.6);
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
      ctx.strokeRect(-hw, -hh*0.85, w, hh*0.6);
      break;
    }
    case 'shovel': {
      ctx.fillStyle = '#7a4a1a';
      ctx.fillRect(-2.5, -hh*0.4, 5, hh*1.4);
      ctx.fillStyle = '#888';
      ctx.beginPath();
      ctx.moveTo(-hw*0.7, hh*0.3); ctx.lineTo(hw*0.7, hh*0.3);
      ctx.lineTo(hw*0.5, hh*1.1); ctx.lineTo(-hw*0.5, hh*1.1);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();
      break;
    }
    case 'knife': {
      ctx.fillStyle = '#2a1a0a';
      ctx.fillRect(-3, -hh*0.2, 6, hh*0.7);
      const grad = ctx.createLinearGradient(-hw, -hh, hw, hh);
      grad.addColorStop(0, '#fff'); grad.addColorStop(0.5, '#bbb'); grad.addColorStop(1, '#777');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-3, -hh*0.2); ctx.lineTo(3, -hh*0.2);
      ctx.lineTo(hw*0.5, -hh*0.95); ctx.lineTo(-hw*0.5, -hh*0.95);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#444'; ctx.stroke();
      break;
    }
    case 'wrench': {
      ctx.fillStyle = '#999';
      ctx.fillRect(-3, -hh*0.5, 6, hh*1.2);
      ctx.strokeStyle = '#aaa'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, -hh*0.6, hw*0.7, Math.PI*0.15, Math.PI*0.85, true); ctx.stroke();
      ctx.fillStyle = '#070a11';
      ctx.beginPath(); ctx.arc(0, -hh*0.6, hw*0.3, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'pruner': {
      ctx.strokeStyle = '#bbb'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-hw*0.6, hh*0.8); ctx.lineTo(hw*0.6, -hh*0.8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hw*0.6, hh*0.8); ctx.lineTo(-hw*0.6, -hh*0.8); ctx.stroke();
      ctx.fillStyle = '#666';
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-hw*0.6, hh*0.8); ctx.lineTo(-hw*0.8, hh*1.1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hw*0.6, hh*0.8); ctx.lineTo(hw*0.8, hh*1.1); ctx.stroke();
      break;
    }
    case 'wateringCan': {
      const grad = ctx.createLinearGradient(-hw, -hh, hw, hh);
      grad.addColorStop(0, '#888'); grad.addColorStop(0.5, '#ccc'); grad.addColorStop(1, '#666');
      ctx.fillStyle = grad;
      roundRect(ctx, -hw*0.7, -hh*0.6, hw*1.2, hh*1.3, 3); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();
      ctx.strokeStyle = '#aaa'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(hw*0.5, -hh*0.2); ctx.lineTo(hw*1.4, -hh*0.8); ctx.stroke();
      ctx.fillStyle = '#bbb';
      ctx.beginPath(); ctx.arc(hw*1.4, -hh*0.8, 4, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -hh*0.6, hw*0.35, Math.PI, 0); ctx.stroke();
      break;
    }
    case 'fishingRod': {
      ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(0, hh); ctx.lineTo(0, -hh); ctx.stroke();
      ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(0, hh); ctx.lineTo(0, hh*0.6); ctx.stroke();
      const t = performance.now()*0.001;
      const wobble = Math.sin(t)*4;
      ctx.strokeStyle = 'rgba(200,200,200,0.8)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -hh); ctx.quadraticCurveTo(hw*2 + wobble, -hh + 30, hw*2 + wobble, -hh + 80);
      ctx.stroke();
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(hw*2 + wobble, -hh + 84, 4, -Math.PI*0.5, Math.PI*0.8); ctx.stroke();
      break;
    }
    case 'net': {
      ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-hw, hh); ctx.lineTo(-hw*0.5, -hh*0.5); ctx.stroke();
      ctx.strokeStyle = '#aaa'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, -hh*0.3, hw*0.8, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 0.8;
      for (let i=-3;i<=3;i++){
        ctx.beginPath(); ctx.moveTo(i*hw*0.22, -hh*0.3 - hw*0.8); ctx.lineTo(i*hw*0.22, -hh*0.3 + hw*0.8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-hw*0.8, -hh*0.3 + i*hw*0.22); ctx.lineTo(hw*0.8, -hh*0.3 + i*hw*0.22); ctx.stroke();
      }
      break;
    }
    case 'umbrella': {
      const grad = ctx.createLinearGradient(0, -hh, 0, hh*0.2);
      grad.addColorStop(0, '#e74c3c'); grad.addColorStop(1, '#a02020');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, -hh*0.3, hw*0.95, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#7a1010'; ctx.lineWidth = 1; ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      for (let i=1;i<4;i++){
        const a = Math.PI + i*Math.PI/4;
        ctx.beginPath(); ctx.moveTo(0, -hh*0.3); ctx.lineTo(Math.cos(a)*hw*0.95, -hh*0.3 + Math.sin(a)*hw*0.95); ctx.stroke();
      }
      ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(0, -hh*0.3); ctx.lineTo(0, hh*0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(-3, hh*0.9, 3, 0, Math.PI, false); ctx.stroke();
      break;
    }
    case 'flashlight': {
      const grad = ctx.createLinearGradient(-hw, 0, hw, 0);
      grad.addColorStop(0, '#666'); grad.addColorStop(0.5, '#aaa'); grad.addColorStop(1, '#555');
      ctx.fillStyle = grad;
      roundRect(ctx, -hw*0.7, -hh*0.5, hw*1.4, hh*1.5, 3); ctx.fill();
      ctx.fillStyle = '#ffe666';
      ctx.beginPath(); ctx.ellipse(0, -hh*0.5, hw*0.8, 4, 0, 0, Math.PI*2); ctx.fill();
      if (b.g.on){
        const grad2 = ctx.createRadialGradient(0, -hh*0.5, 5, 0, -hh*0.5, 80);
        grad2.addColorStop(0, 'rgba(255,255,150,0.7)');
        grad2.addColorStop(1, 'rgba(255,255,150,0)');
        ctx.fillStyle = grad2;
        ctx.beginPath();
        ctx.moveTo(-hw*0.8, -hh*0.5); ctx.lineTo(-hw*2.5, -hh*2);
        ctx.lineTo(hw*2.5, -hh*2); ctx.lineTo(hw*0.8, -hh*0.5);
        ctx.closePath(); ctx.fill();
      }
      break;
    }
    case 'shield': {
      const grad = ctx.createLinearGradient(-hw, -hh, hw, hh);
      grad.addColorStop(0, '#c8a850'); grad.addColorStop(0.5, '#8b6914'); grad.addColorStop(1, '#5a4508');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-hw*0.9, -hh*0.9); ctx.lineTo(hw*0.9, -hh*0.9);
      ctx.quadraticCurveTo(hw, hh*0.2, 0, hh*0.95);
      ctx.quadraticCurveTo(-hw, hh*0.2, -hw*0.9, -hh*0.9);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#3a2a08'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#666';
      ctx.beginPath(); ctx.arc(0, 0, hw*0.3, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'brush': {
      ctx.fillStyle = '#8B4513'; ctx.fillRect(-2, -hh*0.3, 4, hh*0.9);
      ctx.fillStyle = '#888'; ctx.fillRect(-hw*0.7, hh*0.5, hw*1.4, hh*0.15);
      ctx.fillStyle = b.g.brushColor || '#e91e63';
      ctx.beginPath();
      ctx.moveTo(-hw*0.7, hh*0.65); ctx.lineTo(hw*0.7, hh*0.65);
      ctx.lineTo(hw*0.6, hh*1.0); ctx.lineTo(-hw*0.6, hh*1.0);
      ctx.closePath(); ctx.fill();
      break;
    }
    case 'oilCan': {
      const grad = ctx.createLinearGradient(-hw, 0, hw, 0);
      grad.addColorStop(0, '#333'); grad.addColorStop(0.5, '#555'); grad.addColorStop(1, '#222');
      ctx.fillStyle = grad;
      roundRect(ctx, -hw*0.7, -hh*0.4, hw*1.4, hh*1.1, 3); ctx.fill();
      ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.stroke();
      ctx.strokeStyle = '#666'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(hw*0.5, 0); ctx.lineTo(hw*1.5, -hh*0.6); ctx.stroke();
      ctx.fillStyle = '#aa0';
      ctx.font = 'bold 6px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('OIL', 0, hh*0.2);
      break;
    }
  }
  ctx.restore();
}

const TOOL_TYPES = new Set([
  'axe','pickaxe','hammer','shovel','knife','wrench','pruner',
  'wateringCan','fishingRod','net','umbrella','flashlight','shield','brush','oilCan'
]);

function b_rotation(t){ return t; }

Events.on(render, 'afterRender', () => {
  const ctx = render.context;

  /* 1. Все тела */
  for (const b of bodies){
    if (!b.g || b.g.dead) continue;
    const t = b.g.type;
    if (t === 'cat' || t === 'zombieCat') drawCat(ctx, b);
    else if (TOOL_TYPES.has(t)) drawTool(ctx, b);
    else drawBody(ctx, b);
  }

  /* 2. Дым */
  for (const p of smoke){
    ctx.globalAlpha = Math.max(0, p.life/p.maxLife) * 0.55;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* 3. Искры */
  ctx.lineWidth = 1.6;
  for (const s of sparks){
    ctx.globalAlpha = Math.max(0, s.life/s.maxLife);
    ctx.strokeStyle = s.color;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* 4. Лучи */
  for (const bm of beams){
    ctx.strokeStyle = bm.color; ctx.lineWidth = bm.w;
    ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
  }

  /* 5. Подписи */
  ctx.font = 'bold 14px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  for (const b of bodies){
    if (b.g && b.g.label){
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillText(b.g.label, b.position.x, b.position.y - 28);
    }
  }

  /* 6. Захват */
  if (dragPoint && draggedBody && !draggedBody.g.dead){
    ctx.strokeStyle = 'rgba(255,255,120,0.75)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(dragPoint.position.x, dragPoint.position.y);
    ctx.lineTo(draggedBody.position.x, draggedBody.position.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,120,0.95)';
    ctx.beginPath(); ctx.arc(dragPoint.position.x, dragPoint.position.y, 5, 0, Math.PI*2); ctx.fill();
  }

  if (flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${Math.min(1, flash)})`;
    ctx.fillRect(0, 0, W, H);
  }
});

const mouse = { x: W/2, y: H/2 };
const mouseDir = { x: 1, y: 0 };
let lastMouse = { x: W/2, y: H/2 };
let isDown = false;
let lastSpawn = 0;

function toWorld(e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top) * (H / r.height)
  };
}
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  const p = toWorld(e);
  mouse.x = p.x; mouse.y = p.y;
  if (draggedBody) return;
  if (e.button === 2){ interact(p); return; }
  isDown = true;
  if (selected === 'gravityGun'){ gunClick(p); return; }
  if (selected === 'eraser'){ eraseAt(p); return; }
  spawnAt(p);
  lastSpawn = performance.now();
});
canvas.addEventListener('pointermove', e => {
  const p = toWorld(e);
  const dx = p.x - lastMouse.x, dy = p.y - lastMouse.y;
  if (Math.abs(dx) + Math.abs(dy) > 2){ mouseDir.x = dx; mouseDir.y = dy; }
  lastMouse.x = p.x; lastMouse.y = p.y;
  mouse.x = p.x; mouse.y = p.y;
  if (gunPoint) Body.setPosition(gunPoint, p);
  if (dragPoint) Body.setPosition(dragPoint, p);
  if (isDown && selected && ELEMENTS[selected] && ELEMENTS[selected].spawn){
    const now = performance.now();
    if (now - lastSpawn > 55){ spawnAt(p); lastSpawn = now; }
  }
});
window.addEventListener('pointerup', () => { isDown = false; });

function spawnAt(p){
  if (!selected) return;
  const el = ELEMENTS[selected];
  if (!el || !el.spawn) return;
  if (Composite.allBodies(world).length > 1400) return;
  const x = Math.max(30, Math.min(W-30, p.x));
  const y = Math.max(30, Math.min(H-30, p.y));
  el.spawn(x, y);
}
function interact(p){
  const found = Query.point(bodies, p);
  for (const b of found){
    if (b.g && b.g.onClick){ b.g.onClick(b); return; }
  }
}
function eraseAt(p){
  const found = Query.point(bodies, p);
  for (const b of found){ if (!b.isWall) destroyBody(b); }
}

/* Drag & Drop */
let draggedBody = null, dragConstraint = null, dragPoint = null;
function tryGrab(p){
  if (draggedBody) return;
  const found = Query.point(bodies, p);
  for (const b of found){
    if (b.isStatic || !b.g || b.g.dead) continue;
    draggedBody = b;
    dragPoint = Bodies.circle(p.x, p.y, 10, {
      isStatic: true, collisionFilter: { mask: 0 }, render: { visible: false }
    });
    Composite.add(world, dragPoint);
    dragConstraint = Constraint.create({
      bodyA: dragPoint, bodyB: b, stiffness: 0.15, damping: 0.2, length: 0
    });
    Composite.add(world, dragConstraint);
    break;
  }
}
function releaseDrag(){
  if (dragConstraint){ Composite.remove(world, dragConstraint); dragConstraint = null; }
  if (dragPoint){ Composite.remove(world, dragPoint); dragPoint = null; }
  draggedBody = null;
}
window.addEventListener('keydown', e => {
  if (paused) return;
  if (e.code === 'KeyF') tryGrab(mouse);
  if (e.code === 'KeyQ' && draggedBody && !draggedBody.g.dead){
    Body.setAngle(draggedBody, draggedBody.angle - 0.12);
    Body.setAngularVelocity(draggedBody, 0);
  }
  if (e.code === 'KeyE' && draggedBody && !draggedBody.g.dead){
    Body.setAngle(draggedBody, draggedBody.angle + 0.12);
    Body.setAngularVelocity(draggedBody, 0);
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'KeyF' && draggedBody) releaseDrag();
});
window.addEventListener('blur', () => releaseDrag());

/* Гравитационная пушка */
let gunTarget = null, gunConstraint = null, gunPoint = null;
function gunReset(){
  if (gunConstraint) Composite.remove(world, gunConstraint);
  if (gunPoint) Composite.remove(world, gunPoint);
  gunTarget = null; gunConstraint = null; gunPoint = null;
}
function gunClick(p){
  if (gunConstraint && gunTarget && !gunTarget.g.dead){
    Composite.remove(world, gunConstraint);
    const dir = Vector.normalise(Vector.sub(p, gunTarget.position));
    Body.applyForce(gunTarget, gunTarget.position,
      { x:dir.x*0.25*gunTarget.mass, y:dir.y*0.25*gunTarget.mass });
    gunReset(); return;
  }
  gunReset();
  let best = null, bd = 700;
  for (const b of bodies){
    if (b.isStatic || !b.g || b.g.dead) continue;
    const d = dist(b.position, p);
    if (d < bd){ bd = d; best = b; }
  }
  if (!best) return;
  gunTarget = best;
  gunPoint = Bodies.circle(p.x, p.y, 10, {
    isStatic: true, collisionFilter: { mask: 0 }, render: { visible: false }
  });
  Composite.add(world, gunPoint);
  gunConstraint = Constraint.create({
    bodyA: gunPoint, bodyB: best, stiffness: 0.06, damping: 0.12, length: 0
  });
  Composite.add(world, gunConstraint);
}
